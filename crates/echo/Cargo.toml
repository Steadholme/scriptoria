[package]
name = "echo"
version = "0.1.0"
edition = "2021"
description = "Echo — embeddable threaded-comments service for the Steadholme stack (one owned comment layer reusable across blog/wiki/paste)."
license = "MIT OR Apache-2.0"

[lib]
name = "echo"
path = "src/lib.rs"

[[bin]]
name = "echo"
path = "src/main.rs"

[dependencies]
# Odyssey remains available for nonvisual compatibility helpers.
odyssey = { path = "../odyssey" }
# HTTP framework (shared with keystone/inkwell/sanctum): Form/State/Path extractors, typed
# responses, server-rendered HTML.
axum = "0.8"
# Async runtime axum runs on. The Store trait is async: handlers `.await` it directly and
# PgStore drives sqlx natively, so a worker thread is NEVER blocked (no block_in_place, no
# sync-over-async bridge). The audit emitter also `tokio::spawn`s its background worker, and
# its hand-rolled HTTP/1.1 POST needs `net`/`io-util`/`time`.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "time"] }
# Erase the async Store trait methods so `Arc<dyn Store>` stays object-safe (same seam as the
# rest of the estate; a fresh InMemoryStore drops in for tests).
async-trait = "0.1"
# Deserialize the urlencoded comment/moderate form bodies; serde_json serializes audit events.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ergonomic error/store enums -> branded HTML error page.
thiserror = "2"
# Structured logging.
tracing = "0.1"
tracing-subscriber = "0.3"
# Markdown -> HTML for comment bodies. We SANITIZE: raw HTML events are escaped to text and
# link/image URLs are scheme-allowlisted, so no raw HTML / `javascript:` injection survives.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Epoch -> UTC components for the comment timestamps (std only — no extra C deps). Same crate
# the rest of the estate pins.
time = { version = "0.3", default-features = false, features = ["std"] }
# CSPRNG bytes for the double-submit CSRF token. `getrandom` is a tiny libc-backed shim, and
# `hex` (already used by watchtower/inkwell) encodes the token + the random ids.
getrandom = "0.2"
hex = "0.4"
# HMAC-SHA256 verification of the gateway-injected identity signature (X-Auth-Sig). Shared
# primitive with the rest of the estate; the canonical message matches Sluice's Go signer.
hmac = "0.12"
sha2 = "0.10"
# Portable PostgreSQL data layer. Runtime queries only (sqlx::query/Row) — NO compile-time
# macros, so the build needs NO database. rustls TLS (no openssl). Standard SQL only, so the
# same statements later run unchanged on FusionDB over pgwire.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }

[dev-dependencies]
# ServiceExt::oneshot drives the Router in-process for the end-to-end tests (no port bind).
tower = { version = "0.5", features = ["util"] }
