<!DOCTYPE html>
<html lang="{{LANG}}"{{HTML_THEME}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="{{COLOR_SCHEME}}">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <title>{{PAGE_TITLE}} · Lattice · Steadholme</title>
  <link rel="stylesheet" href="/assets/lattice-20260908.css">
</head>
<body class="page-lattice">
  {{APPBAR}}

  <main class="wrap">
    {{CONTENT}}
  </main>

  <script>
    // Scroll-spy: highlight the table-of-contents entry (and, when present, the
    // matching sticky page-tree node) for the heading currently in view. Pure
    // read-only enhancement — the anchors work identically without it.
    (function () {
      var globalSearch = document.getElementById('lattice-global-search');
      document.addEventListener('keydown', function (event) {
        if (event.key === '/' && !event.metaKey && !event.ctrlKey && !event.altKey &&
            !/INPUT|TEXTAREA|SELECT/.test(document.activeElement && document.activeElement.tagName)) {
          event.preventDefault();
          if (globalSearch) { globalSearch.focus(); }
        }
      });

      var links = document.querySelectorAll('.toc__item a[href^="#"]');
      if (!links.length || !('IntersectionObserver' in window)) { return; }
      var liFor = {};
      var order = [];
      Array.prototype.forEach.call(links, function (a) {
        var id = decodeURIComponent(a.getAttribute('href').slice(1));
        var el = id && document.getElementById(id);
        if (el) { liFor[id] = a.parentNode; order.push(el); }
      });
      var current = null;
      function activate(li) {
        if (current === li) { return; }
        if (current) { current.classList.remove('is-active'); }
        current = li;
        if (li) { li.classList.add('is-active'); }
      }
      var visible = {};
      var obs = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { visible[e.target.id] = 1; } else { delete visible[e.target.id]; }
        });
        for (var i = 0; i < order.length; i++) {
          if (visible[order[i].id]) { activate(liFor[order[i].id]); return; }
        }
      }, { rootMargin: '-90px 0px -70% 0px', threshold: 0 });
      order.forEach(function (t) { obs.observe(t); });
    })();

    // Progressive editor preview. It deliberately builds DOM with textContent instead of
    // assigning HTML, so a draft remains inert even before the server-side Markdown sanitizer
    // sees it. Saving and conflict protection stay ordinary HTML form behavior without JS.
    (function () {
      var source = document.querySelector('[data-editor-source]');
      var preview = document.querySelector('[data-editor-preview]');
      if (!source || !preview) { return; }
      function append(tag, text) {
        var node = document.createElement(tag);
        node.textContent = text;
        preview.appendChild(node);
      }
      function render() {
        while (preview.firstChild) { preview.removeChild(preview.firstChild); }
        var inCode = false;
        var code = [];
        source.value.split(/\r?\n/).forEach(function (line) {
          if (/^```/.test(line)) {
            if (inCode) { append('pre', code.join('\n')); code = []; }
            inCode = !inCode;
            return;
          }
          if (inCode) { code.push(line); return; }
          var heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) { append('h' + heading[1].length, heading[2]); return; }
          var item = line.match(/^[-*]\s+(.+)$/);
          if (item) { append('p', '• ' + item[1]); return; }
          if (line.trim()) { append('p', line); }
        });
        if (code.length) { append('pre', code.join('\n')); }
        if (!preview.firstChild) { append('p', 'Preview appears as you write.'); }
      }
      source.addEventListener('input', render);
      preview.setAttribute('aria-live', 'polite');
    })();
  </script>
</body>
</html>
