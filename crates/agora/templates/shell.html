<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <title>{{TITLE}} · Steadholme Agora</title>
  <style>{{STYLE}}</style>
  {{DYNAMIC}}
</head>
<body class="page">
  {{APPBAR}}

  <main class="wrap">
    {{CONTENT}}
  </main>

  <footer class="site-foot">Steadholme Agora · discussion forum · identity by Keystone SSO</footer>

  <div class="toast-host" id="hf-toasts" data-toast-host aria-live="polite" aria-atomic="false"></div>

  <script>
    // Progressive enhancement. Every control below is a real form/link that works without JS
    // (POST→303 / GET navigation). Odyssey wire handles reactions and subscriptions; this
    // local script keeps sort tabs as a lightweight enhancement. Accepted-answer commands use
    // their real POST→303 forms so the server can rebuild the one authoritative Solution region.
    (function () {
      var host = document.getElementById('hf-toasts');
      function toast(msg, kind) {
        if (!host) { return; }
        var t = document.createElement('div');
        t.className = 'toast' + (kind === 'err' ? ' toast--err' : ' toast--ok');
        t.setAttribute('role', 'status');
        t.textContent = msg;
        host.appendChild(t);
        requestAnimationFrame(function () { t.classList.add('is-in'); });
        setTimeout(function () {
          t.classList.remove('is-in');
          setTimeout(function () { if (t.parentNode) { t.parentNode.removeChild(t); } }, 220);
        }, kind === 'err' ? 4200 : 2000);
      }
      // ---- Instant sort tabs (fetch + swap the thread list) ----
      (function () {
        var tabs = document.querySelectorAll('.sort-tabs a[data-sort-tab]');
        if (!tabs.length) { return; }
        function swap(href, pushed) {
          var list = document.querySelector('.thread-list');
          if (list) { list.classList.add('is-busy'); }
          fetch(href, { headers: { 'Accept': 'text/html' }, credentials: 'same-origin' })
            .then(function (r) { if (!r.ok) { throw 0; } return r.text(); })
            .then(function (htmlText) {
              var doc = new DOMParser().parseFromString(htmlText, 'text/html');
              var freshList = doc.querySelector('.thread-list');
              var freshControls = doc.querySelector('[data-thread-controls]');
              if (freshList && list) { list.replaceWith(freshList); }
              var controls = document.querySelector('[data-thread-controls]');
              if (freshControls && controls) { controls.replaceWith(freshControls); bindTabs(); }
              if (pushed) { history.pushState({}, '', href); }
            })
            .catch(function () {
              if (list) { list.classList.remove('is-busy'); }
              toast('Could not load that view', 'err');
              window.location.href = href; // hard fallback
            });
        }
        function bindTabs() {
          Array.prototype.forEach.call(document.querySelectorAll('.sort-tabs a[data-sort-tab]'), function (a) {
            a.addEventListener('click', function (e) {
              if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) { return; }
              e.preventDefault();
              swap(a.getAttribute('href'), true);
            });
          });
        }
        window.addEventListener('popstate', function () { swap(location.pathname + location.search, false); });
        bindTabs();
      })();
    })();
  </script>

  <script>
    // Agora-owned quick search. The form remains a normal GET /search without JavaScript; this
    // layer adds keyboard focus and same-origin suggestions without Odyssey Wire/Spark.
    (function () {
      var form = document.querySelector('[data-ag-quick-search]');
      if (!form) { return; }
      var input = form.querySelector('input[name="q"]');
      var panel = form.querySelector('[data-ag-search-results]');
      if (!input || !panel) { return; }
      var timer = null;
      var requestId = 0;
      var requestController = null;
      var items = [];
      var active = -1;

      function resetPanel() {
        panel.hidden = true;
        panel.textContent = '';
        input.setAttribute('aria-expanded', 'false');
        input.removeAttribute('aria-activedescendant');
        items = [];
        active = -1;
      }

      function invalidateRequest() {
        if (timer) { clearTimeout(timer); timer = null; }
        requestId += 1;
        if (requestController) {
          requestController.abort();
          requestController = null;
        }
      }

      function close() {
        invalidateRequest();
        resetPanel();
      }

      function setActive(next) {
        if (!items.length) { return; }
        active = (next + items.length) % items.length;
        items.forEach(function (item, index) {
          var on = index === active;
          item.classList.toggle('is-active', on);
          item.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        input.setAttribute('aria-activedescendant', items[active].id);
        items[active].scrollIntoView({ block: 'nearest' });
      }

      function render(data) {
        panel.textContent = '';
        items = [];
        active = -1;
        var results = data && Array.isArray(data.results) ? data.results : [];
        results.forEach(function (result, index) {
          var link = document.createElement('a');
          link.className = 'ag-quick-result';
          link.id = 'ag-quick-result-' + index;
          link.href = result.url;
          link.setAttribute('role', 'option');
          link.setAttribute('aria-selected', 'false');
          link.tabIndex = -1;

          var title = document.createElement('span');
          title.className = 'ag-quick-result__title';
          title.textContent = result.title;
          var meta = document.createElement('span');
          meta.className = 'ag-quick-result__meta';
          meta.textContent = result.category + ' · ' + result.replyCount +
            (result.replyCount === 1 ? ' reply' : ' replies') +
            (result.answered ? ' · Answered' : '');
          link.appendChild(title);
          link.appendChild(meta);
          panel.appendChild(link);
          items.push(link);
        });
        if (!items.length) { resetPanel(); return; }
        panel.hidden = false;
        input.setAttribute('aria-expanded', 'true');
      }

      function load() {
        timer = null;
        var query = (input.value || '').trim();
        if (query.length < 3) { close(); return; }
        invalidateRequest();
        var thisRequest = requestId;
        var thisController = typeof AbortController === 'function' ? new AbortController() : null;
        requestController = thisController;
        var requestOptions = {
          headers: { 'Accept': 'application/json' },
          credentials: 'same-origin'
        };
        if (thisController) { requestOptions.signal = thisController.signal; }
        fetch('/api/search/suggest?q=' + encodeURIComponent(query) + '&limit=6', requestOptions)
          .then(function (response) {
            if (!response.ok) { throw new Error('search failed'); }
            return response.json();
          })
          .then(function (data) {
            if (thisRequest === requestId && (input.value || '').trim() === query) { render(data); }
          })
          .catch(function (error) {
            if (error && error.name === 'AbortError') { return; }
            if (thisRequest === requestId) { close(); }
          })
          .then(function () {
            if (thisRequest === requestId) { requestController = null; }
          });
      }

      function schedule() {
        invalidateRequest();
        resetPanel();
        if ((input.value || '').trim().length < 3) { return; }
        timer = setTimeout(load, 300);
      }

      input.addEventListener('input', schedule);
      input.addEventListener('keydown', function (event) {
        if (event.key === 'ArrowDown') {
          event.preventDefault();
          setActive(active + 1);
        } else if (event.key === 'ArrowUp') {
          event.preventDefault();
          setActive(active < 0 ? items.length - 1 : active - 1);
        } else if (event.key === 'Escape') {
          event.preventDefault();
          close();
        } else if (event.key === 'Enter' && active >= 0 && items[active]) {
          event.preventDefault();
          window.location.href = items[active].href;
        }
      });

      document.addEventListener('keydown', function (event) {
        var target = event.target;
        var typing = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' ||
          target.tagName === 'SELECT' || target.isContentEditable);
        var command = (event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k' &&
          (!typing || target === input);
        var slash = event.key === '/' && !event.metaKey && !event.ctrlKey && !event.altKey && !typing;
        if (command || slash) {
          event.preventDefault();
          input.focus();
          input.select();
        }
      });
      form.addEventListener('focusout', function (event) {
        if (event.relatedTarget && form.contains(event.relatedTarget)) { return; }
        setTimeout(function () {
          if (!form.contains(document.activeElement)) { close(); }
        }, 0);
      });
      document.addEventListener('pointerdown', function (event) {
        if (!form.contains(event.target)) { close(); }
      });
    })();
  </script>
</body>
</html>
