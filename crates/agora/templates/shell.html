<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>{{TITLE}} · Steadholme Agora</title>
  <style>{{STYLE}}</style>
  {{DYNAMIC}}
</head>
<body class="page ag-page-shell">
  <a class="ag-skip-link" href="#ag-main">Skip to forum content</a>
  {{APPBAR}}

  <main class="wrap ag-main" id="ag-main" tabindex="-1">
    {{CONTENT}}
  </main>

  <footer class="site-foot">
    <span><strong>Steadholme Agora</strong> · shared discussion, bounded views</span>
    <span>Identity by Keystone SSO</span>
  </footer>

  <div class="toast-host" id="hf-toasts" data-toast-host aria-live="polite" aria-atomic="false"></div>

  <script>
    // Progressive enhancement. Every mutation remains a real POST form and every navigation a
    // real link. This local script only swaps bounded thread-list GET results; a failed request
    // follows the same href as the no-JavaScript path.
    (function () {
      var host = document.getElementById('hf-toasts');
      function toast(msg, kind) {
        if (!host) { return; }
        var t = document.createElement('div');
        t.className = 'toast' + (kind === 'err' ? ' toast--err' : ' toast--ok');
        t.setAttribute('role', 'status');
        t.textContent = msg;
        host.appendChild(t);
        requestAnimationFrame(function () { t.classList.add('is-in'); });
        setTimeout(function () {
          t.classList.remove('is-in');
          setTimeout(function () { if (t.parentNode) { t.parentNode.removeChild(t); } }, 220);
        }, kind === 'err' ? 4200 : 2000);
      }
      // ---- Instant sort tabs (fetch + swap the thread list) ----
      (function () {
        var tabs = document.querySelectorAll('.sort-tabs a[data-sort-tab]');
        if (!tabs.length) { return; }
        var requestId = 0;
        var requestController = null;
        function swap(href, pushed, focusSort) {
          requestId += 1;
          var thisRequest = requestId;
          if (requestController) { requestController.abort(); }
          var thisController = typeof AbortController === 'function' ? new AbortController() : null;
          requestController = thisController;
          var list = document.querySelector('.thread-list');
          if (list) {
            list.classList.add('is-busy');
            list.setAttribute('aria-busy', 'true');
          }
          var requestOptions = {
            headers: { 'Accept': 'text/html' },
            credentials: 'same-origin'
          };
          if (thisController) { requestOptions.signal = thisController.signal; }
          fetch(href, requestOptions)
            .then(function (r) { if (!r.ok) { throw 0; } return r.text(); })
            .then(function (htmlText) {
              if (thisRequest !== requestId) { return; }
              var doc = new DOMParser().parseFromString(htmlText, 'text/html');
              var freshList = doc.querySelector('.thread-list');
              var freshControls = doc.querySelector('[data-thread-controls]');
              var freshFocus = doc.querySelector('#category-focus-heading');
              var controls = document.querySelector('[data-thread-controls]');
              var focus = document.querySelector('#category-focus-heading');
              if (!freshList || !freshControls || !list || !controls ||
                  Boolean(freshFocus) !== Boolean(focus)) { throw 0; }
              list.replaceWith(freshList);
              controls.replaceWith(freshControls);
              if (freshFocus && focus) { focus.replaceWith(freshFocus); }
              bindTabs();
              if (requestController === thisController) { requestController = null; }
              if (pushed) { history.pushState({}, '', href); }
              if (focusSort) {
                var active = document.querySelector(
                  '.sort-tabs a[data-sort-tab="' + focusSort + '"]'
                );
                if (active) {
                  active.focus();
                  toast('Threads sorted by ' + active.textContent.trim(), 'ok');
                }
              }
            })
            .catch(function (error) {
              if (thisRequest !== requestId || (error && error.name === 'AbortError')) { return; }
              if (requestController === thisController) { requestController = null; }
              if (list) { list.classList.remove('is-busy'); }
              if (list) { list.removeAttribute('aria-busy'); }
              toast('Could not load that view', 'err');
              window.location.href = href; // hard fallback
            });
        }
        function bindTabs() {
          Array.prototype.forEach.call(document.querySelectorAll('.sort-tabs a[data-sort-tab]'), function (a) {
            a.addEventListener('click', function (e) {
              if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) { return; }
              e.preventDefault();
              swap(a.getAttribute('href'), true, a.getAttribute('data-sort-tab'));
            });
          });
        }
        window.addEventListener('popstate', function () {
          var sort = new URLSearchParams(location.search).get('sort') || 'latest';
          swap(location.pathname + location.search, false, sort);
        });
        bindTabs();
      })();
      // ---- Page-bounded reading receipts ----
      (function () {
        var form = document.querySelector('[data-thread-read-form]');
        var sentinel = document.querySelector('[data-thread-read-sentinel]');
        if (!form || !sentinel || !window.fetch || !window.IntersectionObserver) { return; }
        var sent = false;
        var observer = new IntersectionObserver(function (entries) {
          if (sent || !entries.some(function (entry) { return entry.isIntersecting; })) { return; }
          sent = true;
          observer.disconnect();
          fetch(form.action, {
            method: 'POST',
            body: new URLSearchParams(new FormData(form)),
            credentials: 'same-origin',
            headers: { 'Accept': 'application/json' }
          }).then(function (response) {
            if (!response.ok) { throw new Error('read receipt failed'); }
            var status = document.querySelector('[data-thread-read-status]');
            var button = document.querySelector('[data-thread-read-submit]');
            if (status) {
              status.textContent =
                'Page marked read · Continue returns to the earliest unread post.';
            }
            if (button) {
              button.textContent = 'Read through this page';
              button.disabled = true;
            }
            var progress = form.closest('[data-thread-read-progress]');
            if (progress) { progress.classList.add('is-read'); }
          }).catch(function () {
            var status = document.querySelector('[data-thread-read-status]');
            if (status) {
              status.textContent =
                'Automatic progress was not saved · use the button to retry.';
            }
            toast('Reading progress was not saved', 'err');
          });
        }, { rootMargin: '0px 0px -8% 0px' });
        observer.observe(sentinel);
      })();
    })();
  </script>

  <script>
    // Agora-owned quick search. The form remains a normal GET /search without JavaScript; this
    // layer adds keyboard focus and same-origin suggestions without Odyssey Wire/Spark.
    (function () {
      var form = document.querySelector('[data-ag-quick-search]');
      if (!form) { return; }
      var input = form.querySelector('input[name="q"]');
      var panel = form.querySelector('[data-ag-search-results]');
      if (!input || !panel) { return; }
      var timer = null;
      var requestId = 0;
      var requestController = null;
      var items = [];
      var active = -1;

      function resetPanel() {
        panel.hidden = true;
        panel.textContent = '';
        input.setAttribute('aria-expanded', 'false');
        input.removeAttribute('aria-activedescendant');
        items = [];
        active = -1;
      }

      function invalidateRequest() {
        if (timer) { clearTimeout(timer); timer = null; }
        requestId += 1;
        if (requestController) {
          requestController.abort();
          requestController = null;
        }
      }

      function close() {
        invalidateRequest();
        resetPanel();
      }

      function setActive(next) {
        if (!items.length) { return; }
        active = (next + items.length) % items.length;
        items.forEach(function (item, index) {
          var on = index === active;
          item.classList.toggle('is-active', on);
          item.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        input.setAttribute('aria-activedescendant', items[active].id);
        items[active].scrollIntoView({ block: 'nearest' });
      }

      function render(data) {
        panel.textContent = '';
        items = [];
        active = -1;
        var results = data && Array.isArray(data.results) ? data.results : [];
        results.forEach(function (result, index) {
          var link = document.createElement('a');
          link.className = 'ag-quick-result';
          link.id = 'ag-quick-result-' + index;
          link.href = result.url;
          link.setAttribute('role', 'option');
          link.setAttribute('aria-selected', 'false');
          link.tabIndex = -1;

          var title = document.createElement('span');
          title.className = 'ag-quick-result__title';
          title.textContent = result.title;
          var meta = document.createElement('span');
          meta.className = 'ag-quick-result__meta';
          meta.textContent = result.category + ' · ' + result.replyCount +
            (result.replyCount === 1 ? ' reply' : ' replies') +
            (result.answered ? ' · Answered' : '');
          link.appendChild(title);
          link.appendChild(meta);
          panel.appendChild(link);
          items.push(link);
        });
        if (!items.length) { resetPanel(); return; }
        panel.hidden = false;
        input.setAttribute('aria-expanded', 'true');
      }

      function load() {
        timer = null;
        var query = (input.value || '').trim();
        if (query.length < 3) { close(); return; }
        invalidateRequest();
        var thisRequest = requestId;
        var thisController = typeof AbortController === 'function' ? new AbortController() : null;
        requestController = thisController;
        var requestOptions = {
          headers: { 'Accept': 'application/json' },
          credentials: 'same-origin'
        };
        if (thisController) { requestOptions.signal = thisController.signal; }
        fetch('/api/search/suggest?q=' + encodeURIComponent(query) + '&limit=6', requestOptions)
          .then(function (response) {
            if (!response.ok) { throw new Error('search failed'); }
            return response.json();
          })
          .then(function (data) {
            if (thisRequest === requestId && (input.value || '').trim() === query) { render(data); }
          })
          .catch(function (error) {
            if (error && error.name === 'AbortError') { return; }
            if (thisRequest === requestId) { close(); }
          })
          .then(function () {
            if (thisRequest === requestId) { requestController = null; }
          });
      }

      function schedule() {
        invalidateRequest();
        resetPanel();
        if ((input.value || '').trim().length < 3) { return; }
        timer = setTimeout(load, 300);
      }

      input.addEventListener('input', schedule);
      input.addEventListener('keydown', function (event) {
        if (event.key === 'ArrowDown') {
          event.preventDefault();
          setActive(active + 1);
        } else if (event.key === 'ArrowUp') {
          event.preventDefault();
          setActive(active < 0 ? items.length - 1 : active - 1);
        } else if (event.key === 'Escape') {
          event.preventDefault();
          close();
        } else if (event.key === 'Enter' && active >= 0 && items[active]) {
          event.preventDefault();
          window.location.href = items[active].href;
        }
      });

      document.addEventListener('keydown', function (event) {
        var target = event.target;
        var typing = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' ||
          target.tagName === 'SELECT' || target.isContentEditable);
        var command = (event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k' &&
          (!typing || target === input);
        var slash = event.key === '/' && !event.metaKey && !event.ctrlKey && !event.altKey && !typing;
        if (command || slash) {
          event.preventDefault();
          input.focus();
          input.select();
        }
      });
      form.addEventListener('focusout', function (event) {
        if (event.relatedTarget && form.contains(event.relatedTarget)) { return; }
        setTimeout(function () {
          if (!form.contains(document.activeElement)) { close(); }
        }, 0);
      });
      document.addEventListener('pointerdown', function (event) {
        if (!form.contains(event.target)) { close(); }
      });
    })();
  </script>

  <script>
    // Compose-time duplicate hints are explicitly heuristic and bounded. The normal /new form
    // remains complete without this enhancement. Draft content is sent only to Agora's
    // same-origin, CSRF-protected endpoint and is written only through text DOM nodes.
    (function () {
      var box = document.querySelector('[data-ag-similar]');
      if (!box) { return; }
      var form = box.closest('form');
      var list = box.querySelector('[data-ag-similar-list]');
      var title = document.getElementById('ag-compose-title');
      var body = document.getElementById('ag-compose-body');
      if (!form || !list || !title || !body || form.getAttribute('action') !== '/new') { return; }
      var csrf = form.querySelector('input[name="csrf"]');
      var timer = null;
      var requestId = 0;
      var controller = null;

      function close() {
        box.hidden = true;
        list.textContent = '';
      }

      function invalidate() {
        if (timer) { clearTimeout(timer); timer = null; }
        requestId += 1;
        if (controller) { controller.abort(); controller = null; }
      }

      function render(data) {
        list.textContent = '';
        var results = data && Array.isArray(data.similar) ? data.similar.slice(0, 3) : [];
        results.forEach(function (result) {
          var item = document.createElement('li');
          var link = document.createElement('a');
          link.href = '/t/' + encodeURIComponent(result.id);
          link.target = '_blank';
          link.rel = 'noopener';
          link.textContent = result.title;
          item.appendChild(link);
          list.appendChild(item);
        });
        box.hidden = results.length === 0;
      }

      function load() {
        timer = null;
        var draftTitle = (title.value || '').trim();
        var draftBody = (body.value || '').trim();
        if (draftTitle.length < 4 && draftBody.length < 12) { close(); return; }
        invalidate();
        var thisRequest = requestId;
        var thisController = typeof AbortController === 'function' ? new AbortController() : null;
        controller = thisController;
        var payload = 'csrf=' + encodeURIComponent(csrf ? csrf.value : '') +
          '&title=' + encodeURIComponent(draftTitle) +
          '&body=' + encodeURIComponent(draftBody);
        var options = {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          credentials: 'same-origin',
          body: payload
        };
        if (thisController) { options.signal = thisController.signal; }
        fetch('/api/similar', options)
          .then(function (response) {
            if (!response.ok) { throw new Error('similarity unavailable'); }
            return response.json();
          })
          .then(function (data) {
            if (thisRequest === requestId) { render(data); }
          })
          .catch(function (error) {
            if (error && error.name === 'AbortError') { return; }
            if (thisRequest === requestId) { close(); }
          })
          .then(function () {
            if (thisRequest === requestId) { controller = null; }
          });
      }

      function schedule() {
        invalidate();
        close();
        timer = setTimeout(load, 500);
      }

      title.addEventListener('input', schedule);
      body.addEventListener('input', schedule);
    })();
  </script>
</body>
</html>
