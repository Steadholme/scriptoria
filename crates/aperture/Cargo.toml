[package]
name = "aperture"
version = "0.1.0"
edition = "2021"
description = "Aperture — enterprise image/screenshot host + file drive for the HOLDFAST stack (SSO-gated; blobs in Cairn S3, metadata in Postgres)."
license = "MIT OR Apache-2.0"

[lib]
name = "aperture"
path = "src/lib.rs"

[[bin]]
name = "aperture"
path = "src/main.rs"

[dependencies]
# HTTP framework (shared with the rest of the estate). `multipart` enables the streaming
# file-upload extractor used by POST /upload.
axum = { version = "0.8", features = ["multipart"] }
# Async runtime axum runs on. Both the Store and the Blobs traits are async: handlers `.await`
# them directly on the serving runtime — sqlx and the S3 client are native async, so a worker
# thread is NEVER blocked (no block_in_place, no sync-over-async bridge).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
# Erase the async trait methods so `Arc<dyn Store>` / `Arc<dyn Blobs>` stay object-safe — the
# same seam the rest of the estate uses.
async-trait = "0.1"
# Deserialize the small HTML form bodies; serde_json is the established error-envelope dep kept
# for parity.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ergonomic error enums.
thiserror = "2"
# Structured logging.
tracing = "0.1"
tracing-subscriber = "0.3"
# Epoch -> UTC components for the "uploaded" timestamps (std only — no extra C deps).
time = { version = "0.3", default-features = false, features = ["std"] }
# CSPRNG (OsRng) for the random file id + the unguessable share token + the double-submit CSRF
# token.
rand = "0.8"
# HMAC-SHA256 verification of the gateway-injected identity signature (X-Auth-Sig). Shared
# primitive with the rest of the estate; the canonical message matches Sluice's Go signer.
hmac = "0.12"
sha2 = "0.10"
# Portable PostgreSQL metadata layer. Runtime queries only (sqlx::query/Row) — NO compile-time
# macros, so the build needs NO database. rustls TLS (ring) — no openssl. The same standard SQL
# later runs unchanged on FusionDB over pgwire.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
# S3-compatible object client for Cairn (custom endpoint, path-style, allow-http). The `aws`
# feature uses reqwest + rustls (ring) — same crypto stack as sqlx, no openssl, no aws-lc/cmake.
object_store = { version = "0.11", features = ["aws"] }
# `Bytes` for the S3 PutPayload boundary.
bytes = "1"

[dev-dependencies]
# ServiceExt::oneshot drives the Router in-process for the end-to-end tests (no port bind).
tower = { version = "0.5", features = ["util"] }
