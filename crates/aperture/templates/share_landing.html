<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{NAME}} &middot; Aperture &middot; HOLDFAST</title>
  {{OG_META}}
  <style>{{CSS}}</style>
</head>
<body class="page-share-landing">
  <header class="appbar">
    <a class="appbar__brand" href="/" aria-label="HOLDFAST Aperture home">
      <span class="app-tile" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/></svg></span>
      <span class="appbar__name"><b>Drive</b><span>drive.w33d.xyz</span></span>
    </a>
    <nav class="appbar__nav" aria-label="Aperture">
      <a class="appnav is-active" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>Files</a>
    </nav>
    <span class="appbar__spacer"></span>
  </header>

  <main class="console share-landing">
    <div class="share-landing__media">{{PREVIEW}}</div>
    <h1 class="share-landing__title">{{NAME}}</h1>
    <p class="share-landing__meta"><span class="mono">{{TYPE}}</span> &middot; {{SIZE}} &middot; <span class="share-landing__views">{{VIEWS}} views</span></p>
    <div class="share-landing__actions">
      <a class="btn btn-primary" href="{{DOWNLOAD_URL}}">Download</a>
    </div>
    {{EMBED}}
  </main>

  <script>
    (function () {
      var buttons = document.querySelectorAll('.copy-btn');
      Array.prototype.forEach.call(buttons, function (btn) {
        btn.addEventListener('click', function () {
          var row = btn.closest ? btn.closest('.embed-box__row') : btn.parentNode;
          var selector = btn.getAttribute('data-copy') || '';
          var input = row ? row.querySelector(selector) : null;
          if (!input) { return; }
          input.select();
          if (input.setSelectionRange) { input.setSelectionRange(0, input.value.length); }
          var done = function () {
            btn.textContent = 'Copied';
            setTimeout(function () { btn.textContent = btn.getAttribute('data-label'); }, 1200);
          };
          if (navigator.clipboard) {
            navigator.clipboard.writeText(input.value).then(done, function () { try { document.execCommand('copy'); done(); } catch (e) {} });
          } else {
            try { document.execCommand('copy'); done(); } catch (e) {}
          }
        });
      });
    })();
  </script>
</body>
</html>
