<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>Drive · Aperture · HOLDFAST</title>
  <style>{{CSS}}</style>
</head>
<body class="page-console">
  <header class="appbar">
    <a class="appbar__brand" href="/" aria-label="HOLDFAST Aperture home">
      <span class="app-tile" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/></svg></span>
      <span class="appbar__name"><b>Drive</b><span>drive.w33d.xyz</span></span>
    </a>
    <nav class="appbar__nav" aria-label="Aperture">
      <a class="appnav is-active" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>Files</a>
      <a class="appnav" href="/requests">Requests</a>
    </nav>
    <span class="appbar__spacer"></span>
    <div class="appbar__right">{{USERBOX}}</div>
  </header>

  <main class="console console--drive">
    <div class="drive-layout" data-wire-nav="#ap-drive">
      <aside class="folder-rail ap-rail" aria-label="Drive navigation">
        <div class="ap-rail__top">{{UPLOAD}}</div>
        <div class="ap-rail__nav">{{SIDEBAR}}</div>
        <div class="ap-rail__bottom">{{USAGE}}</div>
      </aside>

      <div class="drive-content" id="ap-drive" data-spark="view:grid" data-spark-persist="view=aperture:view">
        {{LIBRARY_CONTROLS}}
        <div class="ap-toolbar">
          <div class="ap-toolbar__main">{{BREADCRUMB}}</div>
          <div class="ap-toolbar__side">
            <span class="count-badge" id="countBadge">{{COUNT}}</span>
            <div class="view-toggle" id="viewToggle" role="group" aria-label="Layout" hidden data-spark-uncloak>
              <button type="button" class="view-toggle__btn is-active" data-view="grid" aria-label="Grid view" aria-pressed="true" data-spark-click="set:view=grid" data-spark-class="is-active:view=grid" data-spark-attr="aria-pressed:view=grid"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
              <button type="button" class="view-toggle__btn" data-view="list" aria-label="List view" aria-pressed="false" data-spark-click="set:view=list" data-spark-class="is-active:view=list" data-spark-attr="aria-pressed:view=list"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
            </div>
          </div>
        </div>

        {{FOLDERS_SECTION}}

        <section class="drive-section drive-section--files" aria-labelledby="filesLabel">
          <div class="drive-section__head">
            <h2 class="drive-section__label" id="filesLabel">{{ITEMS_LABEL}}</h2>
          </div>
          <div class="ap-list-head" hidden data-spark-class="is-list:view=list" aria-hidden="true"><span></span><span>Name</span><span data-col="shared">Shared</span><span>Size</span><span data-col="modified">Modified</span><span></span></div>
          <ul class="gallery-grid" data-spark-class="is-list:view=list">
            {{CARDS}}
          </ul>
        </section>

        {{PAGER}}
      </div>
    </div>
  </main>

  <div class="ap-preview" id="apPreview" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="File preview">
    <button class="ap-preview__scrim" type="button" data-preview-close aria-label="Close preview"></button>
    <section class="ap-preview__panel" role="document">
      <header class="ap-preview__bar">
        <div class="ap-preview__title" data-preview-title></div>
        <div class="ap-preview__actions">
          <a class="btn btn-ghost btn-sm" href="/" data-preview-detail>Open detail</a>
          <a class="btn btn-secondary btn-sm" href="/" data-preview-download>Download</a>
          <button class="ap-preview__close" type="button" data-preview-close aria-label="Close preview">×</button>
        </div>
      </header>
      <div class="ap-preview__body" data-preview-body></div>
    </section>
  </div>

	  <div class="ap-dropscrim" aria-hidden="true"></div>
	
	  <div class="toast-host" id="hf-toasts" data-toast-host aria-live="polite" aria-atomic="false"></div>

  {{DYNAMIC}}
  <script>
	    // Progressive enhancement for the drive. Every control is a real form/link that works without
	    // JS. With JS: drag-drop uploads stream with a progress bar and rename uses the JSON seam.
	    (function () {
	      function toast(msg, ok) {
	        if (window.OdysseySpark && window.OdysseySpark.toast) {
	          window.OdysseySpark.toast(msg, ok);
	        }
	      }

      // ---- Drag & drop + XHR upload with a progress bar --------------------
      (function () {
        var input = document.getElementById('fileInput');
        var name = document.getElementById('fileName');
        var zone = document.getElementById('uploadForm');
        var progress = document.getElementById('uploadProgress');
        var bar = document.getElementById('uploadBar');
        if (!input || !zone) { return; }
        function show() {
          if (input.files && input.files.length) {
            name.textContent = input.files[0].name;
            zone.classList.add('has-file');
          } else {
            name.textContent = 'Nothing selected yet';
            zone.classList.remove('has-file');
          }
        }
        var uploading = false;
        function upload() {
          if (!(input.files && input.files.length) || !window.FormData || !window.XMLHttpRequest) {
            zone.submit();
            return;
          }
          if (uploading) { return; }
          uploading = true;
          var fd = new FormData(zone);
          var xhr = new XMLHttpRequest();
          xhr.open('POST', zone.getAttribute('action'), true);
          xhr.setRequestHeader('Accept', 'text/html');
          zone.classList.add('is-busy');
          if (progress) { progress.hidden = false; }
          if (xhr.upload) {
            xhr.upload.addEventListener('progress', function (e) {
              if (e.lengthComputable && bar) {
                var pct = Math.round((e.loaded / e.total) * 100);
                bar.style.width = pct + '%';
                if (progress) { progress.setAttribute('aria-valuenow', String(pct)); }
              }
            });
          }
	          xhr.addEventListener('load', function () {
	            if (xhr.status >= 200 && xhr.status < 400) {
	              toast('Upload complete', true);
	              window.location = xhr.responseURL || '/';
	            } else {
	              uploading = false;
	              zone.classList.remove('is-busy');
	              if (progress) { progress.hidden = true; }
	              toast('Upload failed — please retry', false);
	            }
	          });
          xhr.addEventListener('error', function () {
	            uploading = false;
	            zone.classList.remove('is-busy');
	            if (progress) { progress.hidden = true; }
	            toast('Upload failed — please retry', false);
	          });
          xhr.send(fd);
        }
        input.addEventListener('change', function () { show(); upload(); });
        ['dragenter', 'dragover'].forEach(function (ev) {
          zone.addEventListener(ev, function (e) { e.preventDefault(); zone.classList.add('dragging'); });
        });
        ['dragleave', 'drop'].forEach(function (ev) {
          zone.addEventListener(ev, function (e) { e.preventDefault(); zone.classList.remove('dragging'); });
        });
	        zone.addEventListener('drop', function (e) {
	          if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
	            input.files = e.dataTransfer.files;
	            show();
	            upload();
	          }
	        });
	        var depth = 0;
	        function hasFiles(e) {
	          var types = e.dataTransfer && e.dataTransfer.types;
	          return types && Array.prototype.indexOf.call(types, 'Files') > -1;
	        }
	        document.addEventListener('dragenter', function (e) {
	          if (!hasFiles(e)) { return; }
	          e.preventDefault();
	          depth += 1;
	          document.body.classList.add('is-dragging');
	        });
	        document.addEventListener('dragover', function (e) {
	          if (!hasFiles(e)) { return; }
	          e.preventDefault();
	        });
	        document.addEventListener('dragleave', function () {
	          depth = Math.max(0, depth - 1);
	          if (depth === 0) { document.body.classList.remove('is-dragging'); }
	        });
	        document.addEventListener('drop', function (e) {
	          if (!hasFiles(e)) { return; }
	          e.preventDefault();
	          depth = 0;
	          document.body.classList.remove('is-dragging');
	          if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
	            input.files = e.dataTransfer.files;
	            show();
	            upload();
	          }
	        });
	        // Keep the explicit Upload button working through the same XHR path.
        zone.addEventListener('submit', function (e) {
          if (window.FormData && window.XMLHttpRequest && input.files && input.files.length) {
            e.preventDefault();
            upload();
          }
        });
      })();

      // ---- Inline media preview overlay ------------------------------------
      (function () {
        var overlay = document.getElementById('apPreview');
        if (!overlay) { return; }
        var body = overlay.querySelector('[data-preview-body]');
        var title = overlay.querySelector('[data-preview-title]');
        var detail = overlay.querySelector('[data-preview-detail]');
        var download = overlay.querySelector('[data-preview-download]');
        var closeBtns = overlay.querySelectorAll('[data-preview-close]');
        if (!body || !title || !detail || !download) { return; }

        function clearPreview() {
          var players = body.querySelectorAll('video, audio');
          Array.prototype.forEach.call(players, function (player) {
            try { player.pause(); } catch (e) {}
            player.removeAttribute('src');
            try { player.load(); } catch (e) {}
          });
          body.textContent = '';
        }

        function closePreview() {
          clearPreview();
          overlay.hidden = true;
          overlay.setAttribute('aria-hidden', 'true');
          document.body.classList.remove('has-preview');
        }

        function mediaNode(kind, src, name) {
          var node;
          if (kind === 'video') {
            node = document.createElement('video');
            node.className = 'ap-preview__media ap-preview__media--video';
            node.controls = true;
            node.preload = 'metadata';
            node.setAttribute('playsinline', '');
          } else if (kind === 'audio') {
            node = document.createElement('audio');
            node.className = 'ap-preview__media ap-preview__media--audio';
            node.controls = true;
            node.preload = 'metadata';
          } else if (kind === 'image') {
            node = document.createElement('img');
            node.className = 'ap-preview__media ap-preview__media--image';
            node.alt = name;
          } else {
            return null;
          }
          node.src = src;
          return node;
        }

        function openPreview(card) {
          var id = card.getAttribute('data-preview-id');
          var kind = card.getAttribute('data-preview-kind');
          var name = card.getAttribute('data-preview-name') || 'Preview';
          if (!id || !kind) { return false; }
          var detailUrl = '/f/' + encodeURIComponent(id);
          var rawUrl = detailUrl + '/raw';
          var node = mediaNode(kind, rawUrl, name);
          if (!node) { return false; }
          clearPreview();
          title.textContent = name;
          detail.setAttribute('href', detailUrl);
          download.setAttribute('href', rawUrl);
          body.appendChild(node);
          overlay.hidden = false;
          overlay.setAttribute('aria-hidden', 'false');
          document.body.classList.add('has-preview');
          var close = overlay.querySelector('.ap-preview__close');
          if (close && close.focus) { close.focus(); }
          return true;
        }

        document.addEventListener('click', function (e) {
          if (e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) { return; }
          var target = e.target;
          var card = target.closest ? target.closest('[data-preview]') : null;
          if (!card) { return; }
          if (target.closest('form, button, input, select, textarea, details.card-menu')) { return; }
          if (openPreview(card)) { e.preventDefault(); }
        });
        Array.prototype.forEach.call(closeBtns, function (btn) {
          btn.addEventListener('click', closePreview);
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && !overlay.hidden) { closePreview(); }
        });
      })();

	      // ---- Rename JSON island ---------------------------------------------
	      function recount() {
	        var badge = document.getElementById('countBadge');
	        if (!badge) { return; }
	        var n = document.querySelectorAll('.gallery-grid .file-card[data-file-id]:not(.is-removing)').length;
	        badge.textContent = n === 0 ? 'No files yet' : (n === 1 ? '1 file' : (n + ' files'));
	      }
	
	      function handleRename(form) {
	        var card = form.closest('.file-card');
	        var input = form.querySelector('input[name="name"]');
	        var newName = input ? input.value.trim() : '';
	        if (!newName) { toast('A file name is required', false); return; }
	        var nameEl = card ? card.querySelector('[data-file-name]') : null;
	        var prev = nameEl ? nameEl.textContent : '';
	        if (nameEl) { nameEl.textContent = newName; nameEl.setAttribute('title', newName); }
	        var details = form.closest('details.card-menu');
	        if (details) { details.open = false; }
	        window.OdysseyWire.post(form.action, new FormData(form))
	          .then(function (r) { if (!r.ok) { throw 0; } return r.json(); })
	          .then(function (d) { if (nameEl && d.name) { nameEl.textContent = d.name; nameEl.setAttribute('title', d.name); } toast('File renamed', true); })
	          .catch(function () { if (nameEl) { nameEl.textContent = prev; nameEl.setAttribute('title', prev); } toast('Rename failed', false); });
	      }
	
	      document.addEventListener('wire:after', function (e) {
	        if (!e.detail || /view=trash/.test(e.detail.url || '')) { return; }
	        recount();
	      });

	      // Sync the rail nav highlight to the swapped view (Trash / My Drive / folder) so
	      // wire-navigation feels like Google Drive: content swaps, the active row follows,
	      // no full-page reload. The rail lives OUTSIDE #ap-drive, so it needs this nudge.
	      function syncNav(url) {
	        var here;
	        try { var u = new URL(url || location.href, location.href); here = u.pathname + u.search; }
	        catch (_) { here = location.pathname + location.search; }
	        var rows = document.querySelectorAll('.ap-nav__row');
	        for (var i = 0; i < rows.length; i++) {
	          var href = rows[i].getAttribute('href') || '';
	          var match = href === here || (href === '/' && (here === '/' || here === ''));
	          rows[i].classList.toggle('is-active', match);
	        }
	      }
	      document.addEventListener('wire:after', function (e) { syncNav(e.detail && e.detail.url); });
	      window.addEventListener('popstate', function () { syncNav(location.href); });
	
	      document.addEventListener('submit', function (e) {
	        var form = e.target;
	        if (!form || form.tagName !== 'FORM') { return; }
	        if (form.classList.contains('rename-form')) {
	          if (!window.OdysseyWire) { return; }
	          e.preventDefault();
	          handleRename(form);
	        }
	      });
    })();
  </script>
</body>
</html>
