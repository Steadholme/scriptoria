              <button type="button" class="view-toggle__btn is-active" data-view="grid" aria-label="Grid view" aria-pressed="true" data-spark-click="set:view=grid" data-spark-class="is-active:view=grid" data-spark-attr="aria-pressed:view=grid"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
              <button type="button" class="view-toggle__btn" data-view="list" aria-label="List view" aria-pressed="false" data-spark-click="set:view=list" data-spark-class="is-active:view=list" data-spark-attr="aria-pressed:view=list"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>

  <div class="ap-preview ap-inspector" id="apPreview" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="apInspectorTitle">

	  <div class="ap-dropscrim" aria-hidden="true"></div>
	
	  <div class="toast-host" id="hf-toasts" data-toast-host aria-live="polite" aria-atomic="false"></div>

  {{DYNAMIC}}
  <script>
	    // Progressive enhancement for the drive. Every control is a real form/link that works without
	    // JS. With JS: drag-drop uploads stream with a progress bar and rename uses the JSON seam.
	    (function () {
	      function toast(msg, ok) {
	        if (window.OdysseySpark && window.OdysseySpark.toast) {
	          window.OdysseySpark.toast(msg, ok);
	        }
      }

      // ---- Drag & drop + XHR upload with a progress bar --------------------
      var uploadDragDepth = 0;
      function initUpload(root) {
        root = root || document;
        var input = root.querySelector('#fileInput');
        var name = root.querySelector('#fileName');
        var zone = root.querySelector('#uploadForm');
        var progress = root.querySelector('#uploadProgress');
        var bar = root.querySelector('#uploadBar');
        if (!input || !zone || zone.hasAttribute('data-upload-enhanced')) { return; }
        zone.setAttribute('data-upload-enhanced', 'true');
        function show() {
          if (input.files && input.files.length) {
            name.textContent = input.files[0].name;
            zone.classList.add('has-file');
          } else {
            name.textContent = 'Nothing selected yet';
            zone.classList.remove('has-file');
          }
        }
        var uploading = false;
        function upload() {
          if (!(input.files && input.files.length) || !window.FormData || !window.XMLHttpRequest) {
            zone.submit();
            return;
          }
          if (uploading) { return; }
          uploading = true;
          var fd = new FormData(zone);
          var xhr = new XMLHttpRequest();
          xhr.open('POST', zone.getAttribute('action'), true);
          xhr.setRequestHeader('Accept', 'text/html');
          zone.classList.add('is-busy');
          if (progress) { progress.hidden = false; }
          if (xhr.upload) {
            xhr.upload.addEventListener('progress', function (e) {
              if (e.lengthComputable && bar) {
                var pct = Math.round((e.loaded / e.total) * 100);
                bar.style.width = pct + '%';
                if (progress) { progress.setAttribute('aria-valuenow', String(pct)); }
              }
            });
          }
	          xhr.addEventListener('load', function () {
	            if (xhr.status >= 200 && xhr.status < 400) {
	              toast('Upload complete', true);
	              window.location = xhr.responseURL || '/';
	            } else {
	              uploading = false;
	              zone.classList.remove('is-busy');
	              if (progress) { progress.hidden = true; }
	              toast('Upload failed — please retry', false);
	            }
	          });
          xhr.addEventListener('error', function () {
	            uploading = false;
	            zone.classList.remove('is-busy');
	            if (progress) { progress.hidden = true; }
	            toast('Upload failed — please retry', false);
	          });
          xhr.send(fd);
        }
        input.addEventListener('change', show);
        ['dragenter', 'dragover'].forEach(function (ev) {
          zone.addEventListener(ev, function (e) { e.preventDefault(); zone.classList.add('dragging'); });
        });
        ['dragleave', 'drop'].forEach(function (ev) {
          zone.addEventListener(ev, function (e) { e.preventDefault(); zone.classList.remove('dragging'); });
        });
	        zone.addEventListener('drop', function (e) {
	          if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
	            input.files = e.dataTransfer.files;
	            show();
	            toast('File ready — review the name, then upload', true);
	          }
	        });
	        zone.__apUpload = upload;
	        zone.__apShowUpload = show;
	        // Keep the explicit Upload button working through the same XHR path.
        zone.addEventListener('submit', function (e) {
          if (window.FormData && window.XMLHttpRequest && input.files && input.files.length) {
            e.preventDefault();
            upload();
          }
        });
      }
      initUpload(document);

      // Install the document-level drop contract even when Trash is the first page loaded. The
      // current DOM remains authoritative: only a live upload form may advertise or accept a drop.
      function initUploadDrop() {
        if (document.documentElement.hasAttribute('data-upload-drop-enhanced')) { return; }
        document.documentElement.setAttribute('data-upload-drop-enhanced', 'true');
        function hasFiles(e) {
          var types = e.dataTransfer && e.dataTransfer.types;
          return types && Array.prototype.indexOf.call(types, 'Files') > -1;
        }
        function currentUpload() {
          return {
            zone: document.getElementById('uploadForm'),
            input: document.getElementById('fileInput')
          };
        }
        document.addEventListener('dragenter', function (e) {
          if (!hasFiles(e)) { return; }
          var current = currentUpload();
          if (!current.zone || !current.input) {
            uploadDragDepth = 0;
            document.body.classList.remove('is-dragging');
            return;
          }
          e.preventDefault();
          uploadDragDepth += 1;
          document.body.classList.add('is-dragging');
        });
        document.addEventListener('dragover', function (e) {
          if (!hasFiles(e)) { return; }
          var current = currentUpload();
          if (!current.zone || !current.input) { return; }
          e.preventDefault();
        });
        document.addEventListener('dragleave', function () {
          uploadDragDepth = Math.max(0, uploadDragDepth - 1);
          if (uploadDragDepth === 0) { document.body.classList.remove('is-dragging'); }
        });
        document.addEventListener('drop', function (e) {
          if (!hasFiles(e)) { return; }
          e.preventDefault();
          uploadDragDepth = 0;
          document.body.classList.remove('is-dragging');
          var current = currentUpload();
          if (!current.zone || !current.input) {
            toast('Open My Drive to upload files', false);
            return;
          }
          if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
            current.input.files = e.dataTransfer.files;
            if (current.zone.__apShowUpload) { current.zone.__apShowUpload(); }
            toast('File ready — review the name, then upload', true);
          }
        });
      }
      initUploadDrop();

      // ---- Owner-authoritative in-explorer Inspector ------------------------
      // Every trigger remains a canonical /f/{id} link. Without fetch/JS it navigates to the full
      // detail page; enhancement asks that same owner route for a deliberately token-free fragment.
      (function () {
        var overlay = document.getElementById('apPreview');
        if (!overlay || !window.fetch || !window.DOMParser || !window.history) { return; }
        var panel = overlay.querySelector('.ap-preview__panel');
        var body = overlay.querySelector('[data-inspector-body]');
        var title = overlay.querySelector('[data-preview-title]');
        var detail = overlay.querySelector('[data-preview-detail]');
        var download = overlay.querySelector('[data-preview-download]');
        var closeBtns = overlay.querySelectorAll('[data-preview-close]');
        var closeButton = overlay.querySelector('.ap-preview__close');
        if (!panel || !body || !title || !detail || !download || !closeButton) { return; }

        var requestController = null;
        var requestGeneration = 0;
        var opener = null;
        var activeId = '';
        var previousTitle = document.title;
        var inertState = [];
        var pendingRestoreId = '';

        function fileId(url) {
          var match = url && url.origin === location.origin && url.pathname.match(/^\/f\/([A-Za-z0-9]+)$/);
          return match ? match[1] : '';
        }

        function matchingLink(id) {
          var links = document.querySelectorAll('a[data-inspector-link][href]');
          for (var i = 0; i < links.length; i++) {
            try {
              if (fileId(new URL(links[i].getAttribute('href'), location.href)) === id) { return links[i]; }
            } catch (_) {}
          }
          return null;
        }

        function setBackgroundInert(on) {
          if (on) {
            inertState = [];
            [document.querySelector('.appbar'), document.querySelector('.console--drive')].forEach(function (node) {
              if (!node) { return; }
              inertState.push({ node:node, aria:node.getAttribute('aria-hidden') });
              node.setAttribute('aria-hidden', 'true');
              node.inert = true;
            });
            return;
          }
          inertState.forEach(function (entry) {
            entry.node.inert = false;
            if (entry.aria === null) { entry.node.removeAttribute('aria-hidden'); }
            else { entry.node.setAttribute('aria-hidden', entry.aria); }
          });
          inertState = [];
        }

        function clearInspector() {
          body.querySelectorAll('video, audio').forEach(function (player) {
            try { player.pause(); } catch (_) {}
            player.removeAttribute('src');
            try { player.load(); } catch (_) {}
          });
          body.querySelectorAll('iframe, img').forEach(function (media) { media.removeAttribute('src'); });
          body.textContent = '';
        }

        function markInspected(id) {
          document.querySelectorAll('.file-card.is-inspected').forEach(function (card) {
            card.classList.remove('is-inspected');
          });
          var link = matchingLink(id);
          var card = link && link.closest('.file-card');
          if (card) { card.classList.add('is-inspected'); }
        }

        function focusTarget(id) {
          var target = opener && opener.isConnected ? opener : matchingLink(id);
          if (!target) {
            target = document.querySelector('.drive-content');
            if (target && !target.hasAttribute('tabindex')) { target.setAttribute('tabindex', '-1'); }
          }
          if (target && target.focus) {
            try { target.focus({ preventScroll:true }); } catch (_) { target.focus(); }
          }
        }

        function closeInspector(restoreFocus, waitForSwap) {
          requestGeneration += 1;
          if (requestController) { requestController.abort(); requestController = null; }
          var closingId = activeId;
          clearInspector();
          overlay.hidden = true;
          overlay.setAttribute('aria-hidden', 'true');
          panel.setAttribute('aria-busy', 'false');
          document.body.classList.remove('has-preview');
          setBackgroundInert(false);
          markInspected('');
          document.title = previousTitle;
          activeId = '';
          if (restoreFocus && closingId) {
            pendingRestoreId = waitForSwap ? closingId : '';
            focusTarget(closingId);
          } else if (!waitForSwap) {
            pendingRestoreId = '';
          }
          opener = null;
        }

        function requestClose() {
          var state = history.state && history.state.apertureInspector;
          if (state && state.id === activeId) { history.back(); }
          else { closeInspector(true, false); }
        }

        function openInspector(fragment, url, trigger, pushHistory) {
          var id = fileId(url);
          var name = fragment.getAttribute('data-inspector-name') || 'File';
          clearInspector();
          opener = trigger || matchingLink(id);
          previousTitle = document.title;
          activeId = id;
          pendingRestoreId = '';
          title.textContent = name;
          detail.setAttribute('href', url.pathname);
          download.setAttribute('href', url.pathname + '/raw');
          body.appendChild(document.importNode(fragment, true));
          body.scrollTop = 0;
          overlay.hidden = false;
          overlay.setAttribute('aria-hidden', 'false');
          panel.setAttribute('aria-busy', 'false');
          document.body.classList.add('has-preview');
          closeButton.focus();
          setBackgroundInert(true);
          markInspected(id);
          document.title = name + ' · Drive · Aperture · Steadholme';
          if (pushHistory) {
            history.pushState({ apertureInspector:{
              id:id,
              returnUrl:location.pathname + location.search + location.hash
            } }, '', url.pathname);
          }
          var inserted = body.querySelector('[data-inspector-fragment]');
          if (inserted) {
            inserted.dispatchEvent(new CustomEvent('odyssey:swap', {
              bubbles:true,
              detail:{ url:url.href, mode:'inspector', selector:'[data-inspector-fragment]' }
            }));
          }
        }

        function loadInspector(url, trigger, pushHistory) {
          var id = fileId(url);
          if (!id) { return false; }
          requestGeneration += 1;
          var generation = requestGeneration;
          if (requestController) { requestController.abort(); }
          requestController = window.AbortController ? new AbortController() : null;
          if (trigger) { trigger.setAttribute('aria-busy', 'true'); }
          panel.setAttribute('aria-busy', 'true');
          var options = {
            credentials:'same-origin',
            headers:{ 'Accept':'text/html', 'X-Aperture-Surface':'inspector' }
          };
          if (requestController) { options.signal = requestController.signal; }
          fetch(url.href, options).then(function (response) {
            var contentType = response.headers.get('Content-Type') || '';
            var responseUrl = new URL(response.url, location.href);
            if (!response.ok || responseUrl.origin !== location.origin || responseUrl.pathname !== url.pathname || contentType.toLowerCase().indexOf('text/html') < 0) {
              throw { status:response.status };
            }
            return response.text();
          }).then(function (html) {
            if (generation !== requestGeneration) { throw { stale:true }; }
            var doc = new DOMParser().parseFromString(html, 'text/html');
            var fragment = doc.querySelector('[data-inspector-fragment]');
            if (!fragment || fragment.getAttribute('data-inspector-id') !== id) { throw { status:0 }; }
            openInspector(fragment, url, trigger, pushHistory);
          }).catch(function (error) {
            if ((error && error.name === 'AbortError') || (error && error.stale)) { return; }
            if (pushHistory) { window.location.assign(url.href); }
            else { window.location.reload(); }
          }).finally(function () {
            if (trigger) { trigger.removeAttribute('aria-busy'); }
            if (generation === requestGeneration) {
              requestController = null;
              panel.setAttribute('aria-busy', 'false');
            }
          });
          return true;
        }

        document.addEventListener('click', function (event) {
          if (event.defaultPrevented || event.button || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) { return; }
          var link = event.target.closest && event.target.closest('a[data-inspector-link]');
          if (!link) { return; }
          var url;
          try { url = new URL(link.getAttribute('href'), location.href); } catch (_) { return; }
          if (loadInspector(url, link, true)) { event.preventDefault(); }
        });

        Array.prototype.forEach.call(closeBtns, function (button) {
          button.addEventListener('click', requestClose);
        });

        document.addEventListener('keydown', function (event) {
          if (overlay.hidden) { return; }
          if (event.key === 'Escape') {
            event.preventDefault();
            requestClose();
            return;
          }
          if (event.key !== 'Tab') { return; }
          var focusable = overlay.querySelectorAll('a[href], button:not([disabled]):not([tabindex="-1"]), iframe:not([tabindex="-1"]), video[controls], audio[controls], [tabindex]:not([tabindex="-1"])');
          if (!focusable.length) { event.preventDefault(); closeButton.focus(); return; }
          var first = focusable[0];
          var last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        });

        document.addEventListener('focusin', function (event) {
          if (!overlay.hidden && !overlay.contains(event.target)) { closeButton.focus(); }
        });

        window.addEventListener('popstate', function (event) {
          var state = event.state && event.state.apertureInspector;
          var url = new URL(location.href);
          if (state && state.id === fileId(url)) {
            loadInspector(url, matchingLink(state.id), false);
          } else {
            closeInspector(true, !!(event.state && event.state.odysseyWire));
          }
        });

        document.addEventListener('odyssey:swap', function (event) {
          if (!event.target.matches || !event.target.matches('.drive-layout')) { return; }
          var state = history.state && history.state.apertureInspector;
          if (!state) { closeInspector(false, !!pendingRestoreId); }
          if (pendingRestoreId) {
            var id = pendingRestoreId;
            pendingRestoreId = '';
            Promise.resolve().then(function () { focusTarget(id); });
          }
        });

        window.addEventListener('pagehide', function () {
          if (requestController) { requestController.abort(); }
          clearInspector();
        });
      })();

	      // ---- Rename JSON island ---------------------------------------------
	      function recount() {
	        var badge = document.getElementById('countBadge');
	        if (!badge) { return; }
	        var n = document.querySelectorAll('.gallery-grid .file-card[data-file-id]:not(.is-removing)').length;
	        badge.textContent = n === 0 ? 'No files yet' : (n === 1 ? '1 file' : (n + ' files'));
	      }
	
	      function handleRename(form) {
	        var card = form.closest('.file-card');
	        var input = form.querySelector('input[name="name"]');
	        var newName = input ? input.value.trim() : '';
	        if (!newName) { toast('A file name is required', false); return; }
	        var nameEl = card ? card.querySelector('[data-file-name]') : null;
	        var prev = nameEl ? nameEl.textContent : '';
	        if (nameEl) { nameEl.textContent = newName; nameEl.setAttribute('title', newName); }
	        var details = form.closest('details.card-menu');
	        if (details) { details.open = false; }
	        window.OdysseyWire.post(form.action, new FormData(form))
	          .then(function (r) { if (!r.ok) { throw 0; } return r.json(); })
	          .then(function (d) { if (nameEl && d.name) { nameEl.textContent = d.name; nameEl.setAttribute('title', d.name); } toast('File renamed', true); })
	          .catch(function () { if (nameEl) { nameEl.textContent = prev; nameEl.setAttribute('title', prev); } toast('Rename failed', false); });
	      }
	

	      // Odyssey's generic current-link matcher intentionally treats a query-less href as a
	      // broad route match. Drive views need exact URL state, so the product owns the final rail
	      // projection after both forward Wire navigation and History restoration.
	      function syncNav(url) {
	        var current;
	        try {
	          current = new URL(url || location.href, location.href);
	        } catch (_) {
	          current = new URL(location.href);
	        }
	        var currentView = current.searchParams.get('view') || '';
	        var currentFolder = current.searchParams.get('folder') || '';
	        var knownView = currentView === 'recent' || currentView === 'shared' || currentView === 'trash';
	        document.querySelectorAll('.ap-nav__row').forEach(function (row) {
	          var target = null;
	          try {
	            target = new URL(row.getAttribute('href') || '', location.href);
	          } catch (_) {}
	          var targetView = target ? (target.searchParams.get('view') || '') : '';
	          var targetFolder = target ? (target.searchParams.get('folder') || '') : '';
	          var sameRoute = !!target && target.pathname === current.pathname;
	          var active = sameRoute && (
	            (knownView && targetView === currentView) ||
	            (!knownView && currentFolder && targetFolder === currentFolder) ||
	            (!knownView && !currentFolder && !targetView && !targetFolder)
	          );
	          row.classList.toggle('is-active', active);
	          if (active) { row.setAttribute('aria-current', 'page'); }
	          else { row.removeAttribute('aria-current'); }
	        });
	      }

        // ---- Current-page multi-select enhancement -------------------------
        // Checkboxes and the external `form=` association are the no-JS contract. This layer only
        // adds Shift ranges, select-this-page, selected styling, and a live count.
        var lastBulkItem = null;
        function bulkItems() {
          return Array.prototype.slice.call(document.querySelectorAll('[data-bulk-item]'));
        }
        function syncBulk() {
          var form = document.querySelector('[data-bulk-form]');
          if (!form) {
            document.body.classList.remove('has-bulk-selection');
            return;
          }
          var items = bulkItems();
          var selected = items.filter(function (item) { return item.checked; });
          var anchor = document.querySelector('[data-bulk-anchor]');
          var mobile = window.matchMedia && window.matchMedia('(max-width:720px)').matches;
          document.querySelectorAll('.has-mobile-bulk-owner').forEach(function (owner) {
            owner.classList.remove('has-mobile-bulk-owner');
          });
          if (mobile && selected.length) {
            var label = selected[selected.length - 1].closest('.ap-select');
            if (label) {
              if (label.parentElement) { label.parentElement.classList.add('has-mobile-bulk-owner'); }
              if (label.nextElementSibling !== form) { label.insertAdjacentElement('afterend', form); }
            }
          } else if (anchor && anchor.nextElementSibling !== form) {
            anchor.insertAdjacentElement('afterend', form);
          }
          form.classList.add('is-enhanced');
          form.classList.toggle('has-selection', selected.length > 0);
          form.setAttribute('data-selection-count', String(selected.length));
          document.body.classList.toggle('has-bulk-selection', selected.length > 0);
          items.forEach(function (item) {
            var card = item.closest('.file-card, .folder-tile');
            if (card) { card.classList.toggle('is-selected', item.checked); }
          });
          var count = form.querySelector('[data-bulk-count]');
          if (count) { count.textContent = selected.length + ' selected'; }
          var all = form.querySelector('[data-bulk-select-all]');
          if (all) {
            all.hidden = items.length === 0;
            all.textContent = items.length && selected.length === items.length ? 'Clear selection' : ('Select this page (' + items.length + ')');
            all.setAttribute('aria-pressed', String(items.length > 0 && selected.length === items.length));
          }
          var actions = form.querySelector('[data-bulk-actions]');
          if (actions) { actions.hidden = selected.length === 0; }
          form.querySelectorAll('button[type=submit]').forEach(function (button) { button.disabled = selected.length === 0; });
        }
        document.addEventListener('click', function (event) {
          var all = event.target.closest && event.target.closest('[data-bulk-select-all]');
          if (all) {
            var items = bulkItems();
            var shouldCheck = items.some(function (item) { return !item.checked; });
            items.forEach(function (item) { item.checked = shouldCheck; });
            syncBulk();
            return;
          }
          var item = event.target.closest && event.target.closest('[data-bulk-item]');
          if (!item) { return; }
          var items = bulkItems();
          if (event.shiftKey && lastBulkItem && items.indexOf(lastBulkItem) >= 0) {
            var start = items.indexOf(lastBulkItem);
            var end = items.indexOf(item);
            var low = Math.min(start, end);
            var high = Math.max(start, end);
            for (var i = low; i <= high; i++) { items[i].checked = item.checked; }
          }
          lastBulkItem = item;
          setTimeout(syncBulk, 0);
        });
	      document.addEventListener('odyssey:swap', function (event) {
	        if (!event.target.matches || !event.target.matches('.drive-layout')) { return; }
	        var swapUrl = event.detail && event.detail.url;
	        uploadDragDepth = 0;
	        document.body.classList.remove('is-dragging');
	        lastBulkItem = null;
	        initUpload(event.target);
	        syncBulk();
	        // Popstate calls Odyssey's broad markCurrent() after dispatching odyssey:swap. Re-project
	        // Drive's semantic URL state in a microtask, after that generic matcher and before paint.
	        Promise.resolve().then(function () { syncNav(swapUrl); });
	      });
	      document.addEventListener('wire:after', function () {
	        // GET navigation has already pushed History; mutations deliberately leave it untouched.
	        // Project from the browser URL so a redirected card delete cannot highlight My Drive
	        // while the user remains inside a folder.
	        syncNav(location.href);
	      });
	      window.addEventListener('resize', syncBulk);
	      syncBulk();
	      if (document.readyState === 'loading') {
	        document.addEventListener('DOMContentLoaded', function () { syncNav(location.href); });
	      } else {
	        syncNav(location.href);
	      }
	
	      document.addEventListener('submit', function (e) {
	        var form = e.target;
	        if (!form || form.tagName !== 'FORM') { return; }
	        if (form.classList.contains('trash-form') && form.hasAttribute('data-wire')) {
	          form.addEventListener('wire:error', function () { setTimeout(recount, 0); }, { once:true });
	          setTimeout(recount, 220);
	        }
	        if (form.classList.contains('rename-form')) {
	          if (!window.OdysseyWire) { return; }
	          e.preventDefault();
	          handleRename(form);
	        }
	      });
    })();
  </script>
</body>
</html>
