<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Protected share · Aperture · HOLDFAST</title>
  <style>{{CSS}}</style>
</head>
<body class="page-console">
  <header class="appbar">
    <a class="appbar__brand" href="/" aria-label="HOLDFAST Aperture home">
      <span class="app-tile" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/></svg></span>
      <span class="appbar__name"><b>Drive</b><span>drive.w33d.xyz</span></span>
    </a>
	    <span class="appbar__spacer"></span>
	    <span class="ap-pubbar__tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3v8Z"/><path d="m9 12 2 2 4-5"/></svg>Shared via Drive</span>
	  </header>
	
	  <main class="console ap-gate">
	    <section class="card ap-gate__card">
	      <div class="card__body">
	        <div class="ap-gate__lock" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
	        <h1>Password required</h1>
	        <p class="sub">This share link is password-protected. Enter the password to view the file.</p>
	        {{ERROR}}
	        <form method="post" action="{{ACTION}}">
          <div class="field">
            <label for="pw">Password</label>
            <input id="pw" type="password" name="password" autocomplete="off" autofocus required>
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="submit">Unlock</button>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
