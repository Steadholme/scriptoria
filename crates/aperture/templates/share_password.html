<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Protected share · Aperture · HOLDFAST</title>
  <style>{{CSS}}</style>
</head>
<body class="page-console">
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="/" aria-label="HOLDFAST Drive">
        <span class="brand__glyph" aria-hidden="true">{{SHIELD}}</span>
        <span class="brand__word">HOLDFAST</span>
      </a>
    </div>
  </header>

  <main class="console">
    <div class="console__head">
      <h1>Password required</h1>
      <p class="sub">This share link is password-protected. Enter the password to view the file.</p>
    </div>

    <section class="card">
      <div class="card__body">
        {{ERROR}}
        <form method="post" action="/s/{{TOKEN}}">
          <div class="field">
            <label for="pw">Password</label>
            <input id="pw" type="password" name="password" autocomplete="off" autofocus required>
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="submit">Unlock</button>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
