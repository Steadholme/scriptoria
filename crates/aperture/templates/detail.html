<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>{{NAME}} · Aperture · Steadholme</title>
  <link rel="stylesheet" href="/assets/aperture-20260908.css">
</head>
<body class="page-console">
  <header class="appbar">
    <a class="appbar__brand" href="/" aria-label="Steadholme Aperture home">
      <span class="app-tile" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/></svg></span>
      <span class="appbar__name"><b>Drive</b><span>drive.w33d.xyz</span></span>
    </a>
    <nav class="appbar__nav" aria-label="Aperture">
      <a class="appnav is-active" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>Files</a>
      <a class="appnav" href="/requests">Requests</a>
    </nav>
    <span class="appbar__spacer"></span>
    <div class="appbar__right">{{USERBOX}}</div>
  </header>

  <main class="console">
	    <div class="console__head console__head--row ap-filehead">
	      <div class="ap-filehead__lockup">
	        {{TYPE_TILE}}
	        <div>
	          <h1 class="detail-title">{{NAME}}</h1>
	          {{FACTS}}
	        </div>
	      </div>
	      <a class="btn btn-ghost btn-sm" href="/">Back to drive</a>
	    </div>
	
	    <div class="ap-detail">
	      <section class="ap-stage {{STAGE_MOD}}">
	        <div class="ap-stage__body">{{PREVIEW}}</div>
	      </section>
	
	      <div class="ap-rail ap-detail__rail">
	        <section class="ap-panel">
	          <div class="ap-panel__head"><h2>Sharing</h2></div>
	          <div class="ap-panel__body">
	          {{SHARE}}
	
	          {{EMBED}}
	          </div>
	        </section>
	
	        <section class="ap-panel">
	          <div class="ap-panel__head"><h2>Details</h2></div>
	          <div class="ap-panel__body">
	          {{META_LIST}}
	
	          {{MOVE}}
	          </div>
	        </section>
	
	        <section class="ap-panel ap-panel--sub">
	          	          <div class="ap-panel__body">
	          {{VERSIONS}}
	          </div>
	        </section>
	
	        <section class="ap-panel ap-panel--sub">
	          	          <div class="ap-panel__body">
	          {{COMMENTS}}
	          </div>
	        </section>
	
	        <div class="actions actions--split ap-actionbar">
	          <a class="btn btn-primary" href="/f/{{ID}}/raw">Download</a>
	          {{DELETE}}
	        </div>
	      </div>
	    </div>
	
	    <div id="lightbox" class="lightbox" hidden aria-hidden="true">
	      <img id="lightboxImg" class="lightbox__img" alt="">
	    </div>
	  </main>
	
	  {{DYNAMIC}}
	  <script>
	    (function () {
      var buttons = document.querySelectorAll('.copy-btn');
      Array.prototype.forEach.call(buttons, function (btn) {
        btn.addEventListener('click', function () {
          var row = btn.closest ? btn.closest('.embed-box__row') : btn.parentNode;
          var selector = btn.getAttribute('data-copy') || '';
          var input = row ? row.querySelector(selector) : null;
          if (!input) { return; }
          input.select();
          if (input.setSelectionRange) { input.setSelectionRange(0, input.value.length); }
          var done = function () {
            btn.textContent = 'Copied';
            setTimeout(function () { btn.textContent = btn.getAttribute('data-label'); }, 1200);
          };
          if (navigator.clipboard) {
            navigator.clipboard.writeText(input.value).then(done, function () { try { document.execCommand('copy'); done(); } catch (e) {} });
          } else {
            try { document.execCommand('copy'); done(); } catch (e) {}
          }
        });
      });
    })();

    // Minimal image lightbox (no library): click the inline image to open it full size in an
    // overlay; click the overlay or press Escape to close. Uses the same /f/{id}/raw source.
    (function () {
      var trigger = document.querySelector('.lightbox-trigger');
      var box = document.getElementById('lightbox');
      var boxImg = document.getElementById('lightboxImg');
      var inline = trigger ? trigger.querySelector('img') : null;
      if (!trigger || !box || !boxImg || !inline) { return; }
      function open(e) {
        e.preventDefault();
        boxImg.src = trigger.getAttribute('href');
        boxImg.alt = inline.getAttribute('alt') || '';
        box.hidden = false;
        box.setAttribute('aria-hidden', 'false');
      }
      function close() {
        box.hidden = true;
        box.setAttribute('aria-hidden', 'true');
        boxImg.src = '';
      }
      trigger.addEventListener('click', open);
      box.addEventListener('click', close);
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !box.hidden) { close(); } });
    })();
  </script>
</body>
</html>
