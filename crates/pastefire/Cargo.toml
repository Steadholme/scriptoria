[package]
name = "pastefire"
version = "0.1.0"
edition = "2021"
description = "Pastefire — enterprise pastebin / snippet host for the HOLDFAST stack (SSO-gated, append-then-read)."
license = "MIT OR Apache-2.0"

[lib]
name = "pastefire"
path = "src/lib.rs"

[[bin]]
name = "pastefire"
path = "src/main.rs"

[dependencies]
# HTTP framework (shared with keystone/keyward/watchtower): Form/State/Path extractors,
# typed responses, server-rendered HTML.
axum = "0.8"
# Async runtime axum runs on. The Store trait is async: handlers `.await` it directly and
# PgStore uses sqlx natively, so a worker thread is NEVER blocked (no sync-over-async bridge).
# The audit emitter also `tokio::spawn`s its background worker, and its hand-rolled HTTP/1.1
# POST needs `net`/`io-util`/`time`.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "time"] }
# Erase the async Store trait methods so `Arc<dyn Store>` stays object-safe (same seam as the
# rest of the estate).
async-trait = "0.1"
# Deserialize the HTML form bodies; serde_json builds nothing user-facing here but is the
# established error-envelope dependency kept for parity.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ergonomic error enums.
thiserror = "2"
# Structured logging.
tracing = "0.1"
tracing-subscriber = "0.3"
# Epoch -> UTC components for the "created" timestamps (std only — no extra C deps). Same crate
# keyward/watchtower already pin.
time = { version = "0.3", default-features = false, features = ["std"] }
# CSPRNG (OsRng) for the short random paste id + the double-submit CSRF token. rand 0.8 matches
# keystone's OsRng path.
rand = "0.8"
# HMAC-SHA256 verification of the gateway-injected identity signature (X-Auth-Sig). Shared
# primitive with the rest of the estate; the canonical message matches Sluice's Go signer.
hmac = "0.12"
sha2 = "0.10"
# Portable PostgreSQL data layer. Runtime queries only (sqlx::query/Row) — NO compile-time
# macros, so the build needs NO database. rustls TLS (no openssl). The same standard-SQL
# statements later run unchanged on FusionDB over pgwire.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }

[dev-dependencies]
# ServiceExt::oneshot drives the Router in-process for the end-to-end tests (no port bind).
tower = { version = "0.5", features = ["util"] }
