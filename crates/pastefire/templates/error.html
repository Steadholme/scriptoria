<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>{{STATUS}} · Pastefire · Steadholme</title>
  <link rel="stylesheet" href="/assets/pastefire-20260909.css">
</head>
<body class="page-v2">
<a class="skip-link" href="#main">Skip to the paste</a>
{{TOPBAR}}
  <main class="v2-page v2-page--narrow" id="main" tabindex="-1">
    <section class="card card--message pf-msg pf-msg--{{TONE}}">
      <div class="card__body">
        <div class="pf-msg__glyph" aria-hidden="true">{{GLYPH}}</div>
        <div class="status-code">{{STATUS}}</div>
        <h1 class="message-heading">{{HEADING}}</h1>
        <p class="message-body">{{MESSAGE}}</p>
        <a class="btn btn-primary" href="/">Back to Pastefire</a>
      </div>
    </section>
{{FOOTER}}
  </main>
</body>
</html>
