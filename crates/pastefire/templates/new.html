<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>New paste · Pastefire · HOLDFAST</title>
  <style>{{CSS}}</style>
</head>
<body class="page-console">
  <header class="appbar">
    <a class="appbar__brand" href="/" aria-label="HOLDFAST Pastefire home">
      <span class="app-tile" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg></span>
      <span class="appbar__name"><b>Paste</b><span>paste.w33d.xyz</span></span>
    </a>
    <nav class="appbar__nav" aria-label="Pastefire">
      <a class="appnav is-active" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New paste</a>
    </nav>
    <span class="appbar__spacer"></span>
    <div class="appbar__right">{{USERBOX}}</div>
  </header>

  <main class="console">
    <div class="console__head">
      <h1>New paste</h1>
      <p class="sub">Share a snippet across the estate. Author and identity come from your single sign-on session.</p>
    </div>

    <div class="layout">
      <section class="card">
        <div class="card__head"><h2>Compose</h2></div>
        <div class="card__body">
          {{ERROR}}
          <form method="post" action="/">
            <input type="hidden" name="csrf_token" value="{{CSRF}}">
            <div class="field-row">
              <div class="field field--grow">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" maxlength="200" value="{{TITLE}}" placeholder="Optional — e.g. nginx reverse proxy config">
              </div>
              <div class="field">
                <label for="language">Language</label>
                <select id="language" name="language">{{LANGUAGE_OPTIONS}}</select>
              </div>
              <div class="field">
                <label for="expiry">Expiry</label>
                <select id="expiry" name="expiry">{{EXPIRY_OPTIONS}}</select>
              </div>
            </div>
            <div class="field">
              <label class="check">
                <input type="checkbox" id="burn" name="burn" value="on"{{BURN_CHECKED}}>
                <span>Burn after read — delete on the first view by anyone other than you</span>
              </label>
            </div>
            <div class="field">
              <label for="password">Password <span class="field-hint">optional</span></label>
              <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Leave blank for no password — anyone but you must enter it to view">
            </div>
            <div class="field">
              <label>Files</label>
              <div class="file-editor" id="fileEditor">{{FILE_ROWS}}</div>
              <button class="btn btn-ghost btn-sm" type="button" id="addFileBtn">+ Add file</button>
            </div>
            <div class="actions">
              <button class="btn btn-primary" type="submit">Create paste</button>
            </div>
          </form>

          <template id="fileRowTemplate">
            <div class="file-row" data-file-row>
              <div class="file-row__head">
                <div class="field field--grow">
                  <label>Filename <span class="field-hint">optional</span></label>
                  <input type="text" name="file_name" maxlength="128" value="" placeholder="e.g. main.rs">
                </div>
                <button class="btn btn-ghost btn-sm" type="button" data-file-remove>Remove</button>
              </div>
              <textarea name="file_content" class="code-input" spellcheck="false" autocomplete="off" placeholder="Paste this file's content here…"></textarea>
            </div>
          </template>
        </div>
      </section>

      <section class="card">
        <div class="card__head"><h2>My recent pastes</h2></div>
        <div class="card__body">
          <ul class="paste-list">
            {{RECENT}}
          </ul>
          {{LOAD_OLDER}}
        </div>
      </section>
    </div>
  </main>

  <script>
    // Multi-file compose: add/remove file rows. The row markup is cloned from a static
    // <template> (no user/remote strings interpolated), so this never injects untrusted HTML.
    (function () {
      var editor = document.getElementById('fileEditor');
      var addBtn = document.getElementById('addFileBtn');
      var tpl = document.getElementById('fileRowTemplate');
      if (!editor || !addBtn || !tpl) { return; }
      addBtn.addEventListener('click', function () {
        editor.appendChild(tpl.content.cloneNode(true));
      });
      editor.addEventListener('click', function (ev) {
        var btn = ev.target.closest('[data-file-remove]');
        if (!btn) { return; }
        var rows = editor.querySelectorAll('[data-file-row]');
        if (rows.length <= 1) { return; } // always keep at least one row
        var row = btn.closest('[data-file-row]');
        if (row) { row.remove(); }
      });
    })();
  </script>
</body>
</html>
