<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>New paste · Pastefire · HOLDFAST</title>
  <style>{{CSS}}</style>
</head>
<body class="page-console">
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="/" aria-label="HOLDFAST Pastefire">
        <span class="brand__glyph" aria-hidden="true">{{SHIELD}}</span>
        <span class="brand__word">HOLDFAST</span>
      </a>
      <div class="topbar__right">{{USERBOX}}</div>
    </div>
  </header>

  <main class="console">
    <div class="console__head">
      <h1>New paste</h1>
      <p class="sub">Share a snippet across the estate. Author and identity come from your single sign-on session.</p>
    </div>

    <div class="layout">
      <section class="card">
        <div class="card__head"><h2>Compose</h2></div>
        <div class="card__body">
          {{ERROR}}
          <form method="post" action="/">
            <input type="hidden" name="csrf_token" value="{{CSRF}}">
            <div class="field-row">
              <div class="field field--grow">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" maxlength="200" value="{{TITLE}}" placeholder="Optional — e.g. nginx reverse proxy config">
              </div>
              <div class="field">
                <label for="language">Language</label>
                <select id="language" name="language">{{LANGUAGE_OPTIONS}}</select>
              </div>
              <div class="field">
                <label for="expiry">Expiry</label>
                <select id="expiry" name="expiry">{{EXPIRY_OPTIONS}}</select>
              </div>
            </div>
            <div class="field">
              <label class="check">
                <input type="checkbox" id="burn" name="burn" value="on"{{BURN_CHECKED}}>
                <span>Burn after read — delete on the first view by anyone other than you</span>
              </label>
            </div>
            <div class="field">
              <label for="body">Content</label>
              <textarea id="body" name="body" class="code-input" spellcheck="false" autocomplete="off" placeholder="Paste your snippet here…">{{BODY}}</textarea>
            </div>
            <div class="actions">
              <button class="btn btn-primary" type="submit">Create paste</button>
            </div>
          </form>
        </div>
      </section>

      <section class="card">
        <div class="card__head"><h2>My recent pastes</h2></div>
        <div class="card__body">
          <ul class="paste-list">
            {{RECENT}}
          </ul>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
