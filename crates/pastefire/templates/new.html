<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>New paste · Pastefire · Steadholme</title>
  <style>{{CSS}}</style>
</head>
<body class="page-console">
  <header class="appbar">
    <a class="appbar__brand" href="/" aria-label="Steadholme Pastefire home">
      <span class="app-tile" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg></span>
      <span class="appbar__name"><b>Paste</b><span>paste.w33d.xyz</span></span>
    </a>
    <nav class="appbar__nav" aria-label="Pastefire">
      <a class="appnav is-active" href="/" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New paste</a>
    </nav>
    <span class="appbar__spacer"></span>
    <div class="appbar__right">{{USERBOX}}</div>
  </header>

  <main class="console">
    <div class="console__head">
      <h1>New paste</h1>
      <p class="sub">Share code and text. Burn, protect, expire.</p>
    </div>
    <div class="layout">
      <section class="card compose" data-spark>
        <div class="card__body">
          {{ERROR}}
          <form method="post" action="/" id="composeForm">
            <input type="hidden" name="csrf_token" value="{{CSRF}}">
            <input class="compose__title" type="text" name="title" id="title" maxlength="200" data-spark-charcount
                   placeholder="Untitled paste — optional title" value="{{TITLE_VALUE}}" autocomplete="off">
            <div class="pf-files" id="fileEditor">{{FILE_ROWS}}</div>
            <button type="button" class="btn btn-ghost pf-addfile" id="addFileBtn">+ Add file</button>
            <fieldset class="pf-options">
              <div class="pf-opt">
                <label for="language">Language</label>
                <select class="select select--bar" name="language" id="language" aria-label="Language">{{LANGUAGE_OPTIONS}}</select>
              </div>
              <div class="pf-opt">
                <label for="expiry">Expiry</label>
                <select class="select select--bar" name="expiry" id="expiry" aria-label="Expiry">{{EXPIRY_OPTIONS}}</select>
              </div>
              <label class="pf-burn"><input type="checkbox" name="burn" value="on"{{BURN_CHECKED}}><span>Burn after read</span></label>
              <span class="pf-burn__hint">Destroyed the moment it is first viewed — one reader, once.</span>
              <div class="pf-opt pf-opt--wide">
                <label for="password">Password <span class="field-hint">optional</span></label>
                <input class="input" type="password" name="password" id="password" autocomplete="new-password">
              </div>
            </fieldset>
            <div class="pf-actions">
              <span class="pf-kbd">Ctrl + Enter</span>
              <button type="submit" class="btn btn-primary" title="Ctrl+Enter">Create paste</button>
            </div>
          </form>

          <template id="fileRowTemplate"><div class="pf-file" data-file-row><div class="pf-file__head"><input class="pf-file__name" type="text" name="file_name" maxlength="128" value="" placeholder="Filename including extension (optional)" autocomplete="off"><button class="btn btn-ghost btn-sm editor__remove" type="button" data-file-remove>Remove</button></div><textarea name="file_content" class="code-input pf-editor" spellcheck="false" autocomplete="off" placeholder="Paste your content here…"></textarea></div></template>
        </div>
      </section>
      <aside class="rail">
        <section class="card"><div class="card__head"><h2>My recent pastes</h2></div>
          <div class="card__body card__body--list"><ul class="paste-list">{{RECENT}}</ul>{{LOAD_OLDER}}</div>
        </section>
      </aside>
    </div>
  </main>

  <script>
    document.documentElement.classList.add('js');
    (function () {
      var form = document.getElementById('composeForm');
      var editor = document.getElementById('fileEditor');
      var addBtn = document.getElementById('addFileBtn');
      var tpl = document.getElementById('fileRowTemplate');
      if (!form || !editor || !addBtn || !tpl) { return; }

      function rows() {
        return Array.prototype.slice.call(editor.querySelectorAll('[data-file-row]'));
      }

      addBtn.addEventListener('click', function () {
        var fragment = tpl.content.cloneNode(true);
        var row = fragment.querySelector('[data-file-row]');
        editor.appendChild(fragment);
        var name = row && row.querySelector('input[name="file_name"]');
        if (name) { name.focus(); }
      });

      editor.addEventListener('click', function (ev) {
        var btn = ev.target.closest('[data-file-remove]');
        if (!btn) { return; }
        var all = rows();
        if (all.length <= 1) { return; }
        var row = btn.closest('[data-file-row]');
        if (row) { row.remove(); }
      });

      form.addEventListener('keydown', function (ev) {
        if (ev.key === 'Tab' && !ev.shiftKey && !ev.ctrlKey && !ev.metaKey && ev.target.matches('textarea.pf-editor')) {
          ev.preventDefault();
          ev.target.setRangeText('  ', ev.target.selectionStart, ev.target.selectionEnd, 'end');
          return;
        }
        if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) {
          ev.preventDefault();
          form.requestSubmit();
        }
      });
    })();
  </script>
  {{DYNAMIC}}
</body>
</html>
