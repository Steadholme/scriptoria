<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{TITLE}} · Pastefire · HOLDFAST</title>
  <style>{{CSS}}</style>
</head>
<body class="page-console">
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="/" aria-label="HOLDFAST Pastefire">
        <span class="brand__glyph" aria-hidden="true">{{SHIELD}}</span>
        <span class="brand__word">HOLDFAST</span>
      </a>
      <div class="topbar__right">{{USERBOX}}</div>
    </div>
  </header>

  <main class="console">
    <div class="console__head console__head--row">
      <div>
        <h1>{{TITLE}}</h1>
        <p class="sub">{{META}}</p>
      </div>
      <a class="btn btn-ghost btn-sm" href="/">New paste</a>
    </div>

    {{BURN_NOTICE}}

    <section class="card">
      <div class="card__head">
        <span class="lang-badge lang-badge--lg">{{LANG_LABEL}}</span>
        <div class="code-tools">
          <button class="btn btn-secondary btn-sm" id="copyBtn" type="button" data-label="Copy">Copy</button>
          <a class="btn btn-ghost btn-sm" href="/raw/{{ID}}">View raw</a>
          {{DELETE}}
        </div>
      </div>
      <div class="card__body card__body--code">
        <div id="code" class="code-pre code-lines">{{BODY}}</div>
      </div>
    </section>

    {{SIMILAR}}
  </main>

  <script>
    (function () {
      var btn = document.getElementById('copyBtn');
      var code = document.getElementById('code');
      if (!btn || !code || !navigator.clipboard) { if (btn) { btn.disabled = true; } return; }
      btn.addEventListener('click', function () {
        // Copy only the code cells (never the gutter line numbers), one line per row.
        var cells = code.querySelectorAll('.ln-code');
        var text = Array.prototype.map.call(cells, function (c) { return c.textContent; }).join('\n');
        navigator.clipboard.writeText(text).then(function () {
          btn.textContent = 'Copied';
          setTimeout(function () { btn.textContent = btn.getAttribute('data-label'); }, 1200);
        });
      });
    })();

    // Line-range permalink: a "#L10" or "#L10-L20" fragment highlights that row range and
    // scrolls it into view. Clicking a gutter number sets the fragment (default anchor
    // behavior), which fires hashchange and re-applies the highlight.
    (function () {
      function applyHash() {
        var m = /^#L(\d+)(?:-L(\d+))?$/.exec(location.hash);
        if (!m) { return; }
        var prev = document.querySelectorAll('.ln--hl');
        Array.prototype.forEach.call(prev, function (el) { el.classList.remove('ln--hl'); });
        var a = parseInt(m[1], 10), b = m[2] ? parseInt(m[2], 10) : a;
        if (b < a) { var t = a; a = b; b = t; }
        var first = null;
        for (var n = a; n <= b; n++) {
          var el = document.getElementById('L' + n);
          if (el) { el.classList.add('ln--hl'); if (!first) { first = el; } }
        }
        if (first) { first.scrollIntoView({ block: 'center' }); }
      }
      window.addEventListener('hashchange', applyHash);
      applyHash();
    })();
  </script>
</body>
</html>
