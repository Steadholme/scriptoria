<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{TITLE}} · Pastefire · HOLDFAST</title>
  <style>{{CSS}}</style>
</head>
<body class="page-console">
  <header class="appbar">
    <a class="appbar__brand" href="/" aria-label="HOLDFAST Pastefire home">
      <span class="app-tile" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg></span>
      <span class="appbar__name"><b>Paste</b><span>paste.w33d.xyz</span></span>
    </a>
    <nav class="appbar__nav" aria-label="Pastefire">
      <a class="appnav" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New paste</a>
    </nav>
    <span class="appbar__spacer"></span>
    <div class="appbar__right">{{USERBOX}}</div>
  </header>

  <main class="console">
    <div class="console__head console__head--row">
      <div class="console__lead">
        <h1>{{TITLE}}</h1>
        <p class="sub">{{META}}</p>
        {{SOURCE}}
        <div class="badges">{{BADGES}}</div>
      </div>
      <div class="console__actions">{{ACTIONS}}</div>
    </div>
    {{BURN_NOTICE}}
    <div class="layout layout--view{{LAYOUT_MOD}}">
      <div class="layout__main">
        {{TABS}}
        <section class="card card--code"><div class="card__body card__body--code"><div id="code">{{BODY}}</div></div></section>
      </div>
      {{SIMILAR}}
    </div>
    <div class="toast-host" id="hf-toasts" aria-live="polite"></div>
  </main>

  <script>
    // Minimal toast helper (textContent only — never innerHTML for messages).
    var hfToast = (function () {
      var host = document.getElementById('hf-toasts');
      return function (msg, kind) {
        if (!host) { return; }
        var t = document.createElement('div');
        t.className = 'toast' + (kind === 'err' ? ' toast--err' : ' toast--ok');
        t.setAttribute('role', 'status');
        t.textContent = msg;
        host.appendChild(t);
        requestAnimationFrame(function () { t.classList.add('is-in'); });
        setTimeout(function () {
          t.classList.remove('is-in');
          setTimeout(function () { if (t.parentNode) { t.parentNode.removeChild(t); } }, 220);
        }, kind === 'err' ? 4200 : 2000);
      };
    })();

    // Copy the code cells (never the gutter line numbers) of a given container.
    function copyLines(container, done) {
      var cells = container.querySelectorAll('.ln-code');
      var text = Array.prototype.map.call(cells, function (c) { return c.textContent; }).join('\n');
      if (!navigator.clipboard) { done(false); return; }
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    }

    // Per-file copy buttons in each file block header.
    (function () {
      var buttons = document.querySelectorAll('.file-copy[data-copy="file"]');
      if (!buttons.length) { return; }
      if (!navigator.clipboard) {
        Array.prototype.forEach.call(buttons, function (b) { b.disabled = true; });
        return;
      }
      Array.prototype.forEach.call(buttons, function (btn) {
        btn.addEventListener('click', function () {
          var block = btn.closest('.file-block');
          var body = block && block.querySelector('.code-lines');
          if (!body) { hfToast('Copy failed', 'err'); return; }
          copyLines(body, function (ok) {
            if (ok) {
              btn.textContent = 'Copied';
              setTimeout(function () { btn.textContent = btn.getAttribute('data-label'); }, 1200);
              hfToast('File copied to clipboard', 'ok');
            } else {
              hfToast('Copy failed — select and copy manually', 'err');
            }
          });
        });
      });
    })();

    // Line-range permalink: a "#L10" or "#L10-L20" fragment highlights that row range and
    // scrolls it into view. Clicking a gutter number sets the fragment (default anchor
    // behavior), which fires hashchange and re-applies the highlight.
    (function () {
      function applyHash() {
        var m = /^#L(\d+)(?:-L(\d+))?$/.exec(location.hash);
        if (!m) { return; }
        var prev = document.querySelectorAll('.ln--hl');
        Array.prototype.forEach.call(prev, function (el) { el.classList.remove('ln--hl'); });
        var a = parseInt(m[1], 10), b = m[2] ? parseInt(m[2], 10) : a;
        if (b < a) { var t = a; a = b; b = t; }
        var first = null;
        for (var n = a; n <= b; n++) {
          var el = document.getElementById('L' + n);
          if (el) { el.classList.add('ln--hl'); if (!first) { first = el; } }
        }
        if (first) { first.scrollIntoView({ block: 'center' }); }
      }
      window.addEventListener('hashchange', applyHash);
      applyHash();
    })();
  </script>
</body>
</html>
