<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>History · {{TITLE}} · Pastefire · Steadholme</title>
  <link rel="stylesheet" href="/assets/pastefire-20260909.css">
</head>
<body class="page-v2">
<a class="skip-link" href="#main">Skip to the paste</a>
{{TOPBAR}}
  <main class="v2-page" id="main" tabindex="-1">
    <div class="pagehead">
      <div class="pagehead__titles">
        <nav class="crumb" aria-label="Breadcrumb"><a href="/">Pastes</a><span class="crumb__sep">/</span><a href="/p/{{ID}}">{{ID}}</a><span class="crumb__sep">/</span><span class="crumb__here">History</span></nav>
        <h1>Revision history</h1>
        <p class="pagehead__sub">{{TITLE}}</p>
      </div>
      <div class="pagehead__actions"><a class="btn btn-ghost btn-sm" href="/p/{{ID}}">Back to current</a></div>
    </div>

    {{TABS}}

    <section class="card">
      <div class="card__head"><h2>Versions</h2></div>
      <div class="card__body card__body--list">
        <ul class="eventline pf-hist">
          {{REVISIONS}}
        </ul>
      </div>
    </section>
{{FOOTER}}
  </main>
</body>
</html>
