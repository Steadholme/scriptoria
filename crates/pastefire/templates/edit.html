<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Edit paste · Pastefire · HOLDFAST</title>
  <style>{{CSS}}</style>
</head>
<body class="page-console">
  <header class="appbar">
    <a class="appbar__brand" href="/" aria-label="HOLDFAST Pastefire home">
      <span class="app-tile" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg></span>
      <span class="appbar__name"><b>Paste</b><span>paste.w33d.xyz</span></span>
    </a>
    <nav class="appbar__nav" aria-label="Pastefire">
      <a class="appnav" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New paste</a>
    </nav>
    <span class="appbar__spacer"></span>
    <div class="appbar__right">{{USERBOX}}</div>
  </header>

  <main class="console">
    <div class="console__head console__head--row">
      <div>
        <h1>Edit paste</h1>
        <p class="sub">Your edit is saved as a new version; the previous version is kept in history.</p>
      </div>
      <a class="btn btn-ghost btn-sm" href="/p/{{ID}}">Cancel</a>
    </div>

    <section class="card">
      <div class="card__head"><h2>Revise</h2></div>
      <div class="card__body">
        {{ERROR}}
        <form method="post" action="/edit/{{ID}}">
          <input type="hidden" name="csrf_token" value="{{CSRF}}">
          <div class="field-row">
            <div class="field field--grow">
              <label for="title">Title</label>
              <input type="text" id="title" name="title" maxlength="200" value="{{TITLE}}" placeholder="Optional — e.g. nginx reverse proxy config">
            </div>
            <div class="field">
              <label for="language">Language</label>
              <select id="language" name="language">{{LANGUAGE_OPTIONS}}</select>
            </div>
          </div>
          <div class="field">
            <label for="body">Content</label>
            <textarea id="body" name="body" class="code-input" spellcheck="false" autocomplete="off" placeholder="Paste your snippet here…">{{BODY}}</textarea>
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="submit">Save changes</button>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
