<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Password required · Pastefire · HOLDFAST</title>
  <style>{{CSS}}</style>
</head>
<body class="page-console">
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="/" aria-label="HOLDFAST Pastefire">
        <span class="brand__glyph" aria-hidden="true">{{SHIELD}}</span>
        <span class="brand__word">HOLDFAST</span>
      </a>
      <div class="topbar__right">{{USERBOX}}</div>
    </div>
  </header>

  <main class="console">
    <div class="console__head">
      <h1>Password required</h1>
      <p class="sub">This paste is protected. Enter its password to view the contents.</p>
    </div>

    <section class="card">
      <div class="card__head"><h2>Unlock</h2></div>
      <div class="card__body">
        {{ERROR}}
        <form method="post" action="/unlock/{{ID}}">
          <input type="hidden" name="csrf_token" value="{{CSRF}}">
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="off" autofocus>
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="submit">Unlock</button>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
