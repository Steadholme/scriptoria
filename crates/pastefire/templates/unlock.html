<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>Password required · Pastefire · Steadholme</title>
  <link rel="stylesheet" href="/assets/pastefire-20260909.css">
</head>
<body class="page-v2">
<a class="skip-link" href="#main">Skip to the paste</a>
{{TOPBAR}}
  <main class="v2-page v2-page--narrow pf-gate" id="main" tabindex="-1">
    <section class="card pf-gate__card">
      <div class="card__body">
        <div class="pf-gate__glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
        <h1>Password required</h1>
        <span class="pf-gate__id">{{ID}}</span>
        {{ERROR}}
        <form method="post" action="/unlock/{{ID}}">
          <input type="hidden" name="csrf_token" value="{{CSRF}}">
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="off" autofocus>
          </div>
          <div class="actions">
            <button class="btn btn-primary" type="submit">Unlock</button>
          </div>
        </form>
      </div>
    </section>
{{FOOTER}}
  </main>
</body>
</html>
