<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{BLOG_TITLE}} · HOLDFAST</title>
  <link rel="alternate" type="application/rss+xml" title="Inkwell · HOLDFAST" href="/feed.xml">
  <style>{{CSS}}</style>
</head>
<body class="page-reading">
{{TOPBAR}}
<main class="reader">
  <div class="reader__head">
    <div>
      <h1 class="reader__title">{{BLOG_TITLE}}</h1>
      <p class="reader__sub">{{TAGLINE}}</p>
    </div>
    <div class="reader__actions">
      <a class="btn btn-secondary" href="/ask">Ask the blog</a>
      <a class="btn btn-primary" href="/new">New post</a>
    </div>
  </div>
  <div class="post-list">
    {{POSTS}}
  </div>
  {{PAGER}}
</main>
</body>
</html>
