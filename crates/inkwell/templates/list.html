<main class="reader{{PAGE_CLASS}}">
  <header class="ink-masthead">
    <div>
      <p class="ink-masthead__eyebrow">{{MH_EYEBROW}}</p>
      <h1 class="ink-masthead__title">{{BLOG_TITLE}}</h1>
      <p class="ink-masthead__tagline">{{TAGLINE}}</p>
    </div>
    <div class="reader__actions">
      <a class="btn btn-ghost" href="/search">Search</a>
      <a class="btn btn-ghost" href="/ask">Ask the blog</a>
      <a class="btn btn-primary" href="/new">New post</a>
      <a class="ink-rss" href="/feed.xml">RSS</a>
    </div>
  </header>
  {{HERO}}
  <div class="post-list">
    {{POSTS}}
  </div>
  {{PAGER}}
</main>
