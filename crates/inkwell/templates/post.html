<main class="v2-page reader ink-article" id="main" tabindex="-1">
<span id="article-top"></span>
  <a class="back-link" href="/">&larr; All posts</a>
  <article class="article">
    <header class="article__head">
      {{EYEBROW}}
      <h1 class="article__title">{{TITLE}}</h1>
      <div class="article__meta">{{META}}</div>
      {{ACTIONS}}
    </header>
    {{COVER}}
    {{TOC}}
    <div class="article__body">
      {{BODY}}
    </div>
    <footer class="ink-article__foot">{{TAGS}}{{FOOTNAV}}</footer>
  </article>
  {{RELATED}}
</main>
