<main class="reader ink-article">
  <a class="back-link" href="/">&larr; All posts</a>
  <article class="article">
    <header class="article__head">
      <h1 class="article__title">{{TITLE}}</h1>
      <div class="article__meta">{{META}}</div>
      {{ACTIONS}}
    </header>
    {{COVER}}
    <div class="article__body">
      {{BODY}}
    </div>
    <footer class="ink-article__foot">{{TAGS}}</footer>
  </article>
  {{RELATED}}
</main>
