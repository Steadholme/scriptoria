<main class="v2-page console console--narrow" id="main" tabindex="-1">
  <div class="pagehead ink-pubhead">
    <div class="pagehead__titles">
      <nav class="crumb" aria-label="Breadcrumb"><a href="/">Posts</a><span class="crumb__sep">/</span><span class="crumb__here">Ask</span></nav>
      <h1>Ask the blog</h1>
      <p class="pagehead__sub">Answers are drawn from published posts and cite them.</p>
    </div>
  </div>
  <form class="editor ink-ask" method="post" action="/api/ask">
    <input type="hidden" name="csrf_token" value="{{CSRF}}">
    <div class="field">
      <label for="question">Question</label>
      <textarea id="question" name="question" class="editor__body" placeholder="What have I written about&hellip;?" required>{{QUESTION}}</textarea>
    </div>
    <div class="ink-ask__foot">
      <span class="ink-ask__hint">Answers come only from your published posts.</span>
      <span class="spacer"></span>
      <a class="btn btn-ghost" href="/">Back to the blog</a>
      <button class="btn btn-primary" type="submit">Ask</button>
    </div>
  </form>
  {{ANSWER}}
</main>
