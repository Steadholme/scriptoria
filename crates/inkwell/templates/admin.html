<main class="v2-page console" id="main" tabindex="-1">
  <div class="pagehead">
    <div class="pagehead__titles">
      <nav class="crumb" aria-label="Breadcrumb"><a href="/">Posts</a><span class="crumb__sep">/</span><span class="crumb__here">Admin</span></nav>
      <h1>Admin</h1>
    </div>
  </div>

  <section class="card">
    <div class="card__body">
      <h2>Site settings</h2>
      <form class="editor ink-form" method="post" action="/admin/settings">
        <input type="hidden" name="csrf_token" value="{{CSRF}}">
        <div class="field field--wide">
          <label for="title">Blog title</label>
          <input type="text" id="title" name="title" maxlength="200" value="{{SETTINGS_TITLE}}">
        </div>
        <div class="field field--wide">
          <label for="tagline">Tagline</label>
          <input type="text" id="tagline" name="tagline" maxlength="300" value="{{SETTINGS_TAGLINE}}">
        </div>
        <div class="field">
          <label for="posts_per_page">Posts per page</label>
          <input type="number" id="posts_per_page" name="posts_per_page" min="1" max="200" value="{{SETTINGS_PPP}}">
        </div>
        <div class="editor__actions">
          <button class="btn btn-primary" type="submit">Save settings</button>
        </div>
      </form>
    </div>
  </section>

  <section class="card">
    <div class="card__body">
      <h2>All posts</h2>
      <form id="bulk-form" class="admin-bulk" method="post" action="/admin/posts/bulk">
        <input type="hidden" name="csrf_token" value="{{CSRF}}">
        <label for="bulk-action">Bulk action</label>
        <select id="bulk-action" name="action">
          <option value="pin">Pin</option>
          <option value="unpin">Unpin</option>
          <option value="feature">Feature</option>
          <option value="unfeature">Unfeature</option>
          <option value="unpublish">Unpublish</option>
          <option value="delete">Delete</option>
        </select>
        <button class="btn btn-secondary btn-sm" type="submit">Apply to selected</button>
      </form>
      <table class="admin-table">
        <thead>
          <tr>
            <th class="admin-table__check"></th>
            <th>Title</th>
            <th>Author</th>
            <th>Status</th>
            <th>Pinned</th>
            <th>Featured</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
{{ROWS}}
        </tbody>
      </table>
    </div>
  </section>
</main>
