<main class="v2-page console console--narrow" id="main" tabindex="-1">
  <div class="pagehead ink-pubhead">
    <div class="pagehead__titles">
      <nav class="crumb" aria-label="Breadcrumb"><a href="/">Posts</a><span class="crumb__sep">/</span><span class="crumb__here">Search</span></nav>
      <h1>Search</h1>
      <p class="pagehead__sub">Full text, published posts only.</p>
    </div>
  </div>
  <form class="ink-search" method="get" action="/search">
    <div class="ink-search__box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <label class="sr-only" for="q">Search</label>
      <input type="text" id="q" name="q" maxlength="200" placeholder="Search posts&hellip;" value="{{QUERY}}" autofocus>
    </div>
    <button class="btn btn-primary" type="submit">Search</button>
  </form>
  <p class="ink-search__hint"><a href="/">Back to the blog</a></p>
  {{RESULTS}}
</main>
